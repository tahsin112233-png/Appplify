<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Applify">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.json">
<title>Applify</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --st:env(safe-area-inset-top,44px);--sb:env(safe-area-inset-bottom,34px);
  --acc:#007AFF;--red:#FF3B30;
  --t1:rgba(255,255,255,.95);--t2:rgba(255,255,255,.55);--t3:rgba(255,255,255,.3);--t4:rgba(255,255,255,.1);
  --g1:rgba(255,255,255,.09);--g2:rgba(255,255,255,.17);
  --r2:16px;--r3:22px;--r4:28px;--rf:999px;
  --nav:80px;--fn:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;overscroll-behavior:none}
body{font-family:var(--fn);background:#000;color:var(--t1);height:100%;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}

/* ORBS */
#orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
#o1{width:420px;height:420px;top:-110px;right:-110px;background:rgba(0,100,200,.4);opacity:.55;animation:oa 16s ease-in-out infinite}
#o2{width:300px;height:300px;bottom:60px;left:-70px;background:rgba(88,86,214,.45);opacity:.38;animation:ob 13s ease-in-out infinite}
#o3{width:240px;height:240px;top:42%;left:20%;background:rgba(0,122,255,.3);opacity:.28;animation:oc 19s ease-in-out infinite}
@keyframes oa{0%,100%{transform:translate(0,0) scale(1)}40%{transform:translate(22px,-18px) scale(1.08)}70%{transform:translate(-14px,16px) scale(.93)}}
@keyframes ob{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,-22px)}}
@keyframes oc{0%,100%{transform:translate(0,0)}35%{transform:translate(-18px,14px)}68%{transform:translate(16px,-11px)}}

/* SHELL */
#app{position:fixed;inset:0;display:flex;flex-direction:column;z-index:1}
.view{display:none;flex-direction:column;flex:1;overflow:hidden;padding-top:var(--st)}
.view.active{display:flex}
.scr{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1}

/* NAV */
#nav{position:relative;z-index:100;display:flex;align-items:center;justify-content:space-around;height:var(--nav);padding-bottom:var(--sb);background:rgba(0,0,0,.7);backdrop-filter:blur(36px) saturate(200%);-webkit-backdrop-filter:blur(36px) saturate(200%);border-top:1px solid rgba(255,255,255,.1);flex-shrink:0}
.nb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 20px;border:none;background:none;color:var(--t3);cursor:pointer;-webkit-appearance:none;transition:color .2s,transform .2s cubic-bezier(.34,1.56,.64,1);font-size:10px;font-weight:500;font-family:var(--fn)}
.nb svg{width:22px;height:22px}
.nb.on{color:var(--acc)}
.nb:active{transform:scale(.86)}

/* MINI PLAYER */
#mini{display:none;margin:8px 12px 0;flex-shrink:0;position:relative;z-index:50;border-radius:var(--r3);overflow:hidden;cursor:pointer}
#mini.show{display:block}
#mini-in{display:flex;align-items:center;gap:12px;padding:10px 12px;background:rgba(255,255,255,.11);backdrop-filter:blur(32px) saturate(200%);-webkit-backdrop-filter:blur(32px) saturate(200%);border:1px solid rgba(255,255,255,.19);border-radius:var(--r3)}
#m-art{width:44px;height:44px;border-radius:9px;object-fit:cover;background:var(--t4);flex-shrink:0}
#m-info{flex:1;overflow:hidden}
#m-ttl{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#m-ath{font-size:11px;color:var(--t2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#m-ctrls{display:flex;gap:6px;flex-shrink:0}
.mb{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.13);color:var(--t1);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-appearance:none;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.mb:active{transform:scale(.82)}
#m-bar{position:absolute;bottom:0;left:0;right:0;height:2px;background:rgba(255,255,255,.1);border-radius:0 0 var(--r3) var(--r3)}
#m-fill{height:100%;background:var(--acc);width:0%;transition:width .8s linear;border-radius:inherit}

/* HOME */
.hg{padding:14px 20px 4px}
.hg-sub{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.9px;margin-bottom:3px}
.hg-ttl{font-size:30px;font-weight:800;letter-spacing:-.5px}
#rgn-btn{display:inline-flex;align-items:center;gap:7px;margin:10px 20px 4px;padding:6px 14px;border-radius:var(--rf);border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:var(--t2);font-size:13px;font-weight:500;cursor:pointer;-webkit-appearance:none;font-family:var(--fn);transition:all .2s}
#rgn-btn:active{transform:scale(.93)}
.sh{display:flex;align-items:baseline;padding:18px 20px 10px}
.st{font-size:19px;font-weight:700;letter-spacing:-.3px}
.frow{display:flex;gap:14px;padding:0 20px 4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.fc{flex-shrink:0;width:230px;height:145px;border-radius:var(--r3);overflow:hidden;position:relative;cursor:pointer;transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.fc:active{transform:scale(.94)}
.fc img{width:100%;height:100%;object-fit:cover}
.fc-ov{position:absolute;inset:0;background:linear-gradient(150deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.78) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:12px}
.fc-ttl{font-size:14px;font-weight:700;line-height:1.3;text-shadow:0 1px 5px rgba(0,0,0,.7)}
.fc-ath{font-size:11px;color:rgba(255,255,255,.68);margin-top:2px}
.fc-bdg{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.58);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);border-radius:var(--rf);padding:3px 8px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.grow{display:flex;gap:12px;padding:0 20px 4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.gc{flex-shrink:0;width:126px;cursor:pointer;transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.gc:active{transform:scale(.92)}
.gc img{width:126px;height:126px;border-radius:var(--r2);object-fit:cover;background:var(--t4);display:block}
.gc-ttl{font-size:13px;font-weight:600;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-sub{font-size:11px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc{flex-shrink:0;width:126px;cursor:pointer;transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.mc:active{transform:scale(.92)}
.mc-img{width:126px;height:126px;border-radius:var(--r2);display:flex;align-items:center;justify-content:center;font-size:52px}
.mc-lbl{font-size:13px;font-weight:600;margin-top:7px;text-align:center}
.ri{display:flex;align-items:center;gap:12px;padding:9px 20px;cursor:pointer;transition:background .14s}
.ri:active{background:rgba(255,255,255,.06)}
.ri img{width:46px;height:46px;border-radius:9px;object-fit:cover;background:var(--t4);flex-shrink:0}
.ri-inf{flex:1;overflow:hidden}
.ri-ttl{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-sub{font-size:12px;color:var(--t2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-pb{width:32px;height:32px;border-radius:50%;border:none;background:rgba(255,255,255,.1);color:var(--t1);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;-webkit-appearance:none;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.ri-pb:active{transform:scale(.8)}
.sk{background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.05) 75%);background-size:200% 100%;animation:sk 1.4s infinite;border-radius:8px}
.sk-fc{width:230px;height:145px;border-radius:var(--r3);flex-shrink:0}
.sk-gc{width:126px;height:126px;border-radius:var(--r2);flex-shrink:0}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* SEARCH */
.vh{padding:12px 20px 10px;flex-shrink:0}
.vt{font-size:30px;font-weight:800;letter-spacing:-.5px}
#sbox{position:relative;margin:0 20px 10px}
#sinput{width:100%;padding:12px 42px 12px 16px;border-radius:var(--rf);border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.1);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--t1);font-family:var(--fn);font-size:16px;outline:none;-webkit-appearance:none;transition:all .2s}
#sinput:focus{border-color:rgba(0,122,255,.6);box-shadow:0 0 0 3px rgba(0,122,255,.15);background:rgba(255,255,255,.12)}
#sinput::placeholder{color:var(--t3)}
#sclr{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:none;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.22);border:none;cursor:pointer;color:var(--t1);font-size:12px;align-items:center;justify-content:center;-webkit-appearance:none}
#sclr.show{display:flex}
#chips{display:flex;gap:8px;padding:0 20px 10px;overflow-x:auto;flex-shrink:0}
.chip{padding:6px 15px;border-radius:var(--rf);border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:var(--t2);font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;-webkit-appearance:none;font-family:var(--fn);transition:all .18s}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip:active{transform:scale(.92)}
#suggs{display:none;flex-direction:column;padding:0 12px 4px;gap:1px;flex-shrink:0}
#suggs.show{display:flex}
.sg{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r2);cursor:pointer;transition:background .14s}
.sg:active{background:rgba(255,255,255,.06)}
.sg svg{width:15px;height:15px;color:var(--t3);flex-shrink:0}
.ti{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r2);cursor:pointer;transition:background .14s}
.ti:active{background:rgba(255,255,255,.06)}
.ti.np .ttl{color:var(--acc)}
.ti img{width:54px;height:54px;border-radius:10px;object-fit:cover;background:var(--t4);flex-shrink:0}
.ti-inf{flex:1;overflow:hidden}
.ttl{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{font-size:12px;color:var(--t3);flex-shrink:0}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:60px 32px;text-align:center}
.ei{font-size:52px;opacity:.5}.et{font-size:18px;font-weight:600;color:var(--t2)}.es{font-size:14px;color:var(--t3);line-height:1.5;max-width:240px}
.ld{display:flex;align-items:center;justify-content:center;padding:48px;flex-direction:column;gap:14px}
.sp{width:28px;height:28px;border:2.5px solid rgba(255,255,255,.1);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sp-t{font-size:14px;color:var(--t3)}

/* QUEUE */
.qi{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--r2);cursor:pointer;transition:background .14s}
.qi:active{background:rgba(255,255,255,.06)}
.qn{width:24px;text-align:center;font-size:12px;color:var(--t3);flex-shrink:0}
.qn.np{color:var(--acc);font-size:9px}

/* PLAYER */
#player{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;transform:translateY(100%);transition:transform .42s cubic-bezier(.32,.72,0,1)}
#player.open{display:flex;transform:translateY(0)}
#pbg{position:absolute;inset:0;z-index:0;overflow:hidden}
#pbgi{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(80px) brightness(.28) saturate(2.8);transform:scale(1.5);transition:background-image .9s ease}
#pbgo{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.1) 0%,rgba(0,0,0,.05) 30%,rgba(0,0,0,.55) 72%,rgba(0,0,0,.94) 100%)}
#pc{position:relative;z-index:1;display:flex;flex-direction:column;flex:1;padding:0 24px;padding-top:var(--st);padding-bottom:calc(var(--sb) + 14px);overflow:hidden}
#phdr{display:flex;align-items:center;justify-content:space-between;padding:12px 0 16px}
.phb{width:36px;height:36px;border:none;background:rgba(255,255,255,.14);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:50%;cursor:pointer;color:var(--t1);display:flex;align-items:center;justify-content:center;-webkit-appearance:none;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.phb:active{transform:scale(.84)}
#plbl{font-size:11px;font-weight:700;color:var(--t2);letter-spacing:1.2px;text-transform:uppercase}
#artw{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 0;min-height:0}
#art{width:min(100%,290px);aspect-ratio:1;border-radius:var(--r4);object-fit:cover;box-shadow:0 32px 80px rgba(0,0,0,.8);transition:transform .42s cubic-bezier(.34,1.56,.64,1),opacity .3s;background:var(--t4)}
#art.loading{transform:scale(.88);opacity:.45}
#art.playing{transform:scale(1)}
#art.paused{transform:scale(.91)}
#tirow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
#tinf{flex:1;overflow:hidden}
#pttl{font-size:21px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#path{font-size:15px;color:var(--t2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lkbtn{width:36px;height:36px;border:none;background:none;cursor:pointer;color:var(--t3);display:flex;align-items:center;justify-content:center;-webkit-appearance:none;flex-shrink:0;transition:transform .2s cubic-bezier(.34,1.56,.64,1),color .2s}
#lkbtn.on{color:var(--red)}
#lkbtn:active{transform:scale(.76)}
#progw{padding:8px 0 2px}
#pbar{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.2);outline:none;cursor:pointer}
#pbar::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:transform .14s}
#pbar:active::-webkit-slider-thumb{transform:scale(1.35)}
#trow{display:flex;justify-content:space-between;margin-top:5px}
.tl{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
#ctrls{display:flex;align-items:center;justify-content:space-between;padding:12px 0 6px}
.cb{width:48px;height:48px;border:none;background:none;cursor:pointer;color:var(--t1);display:flex;align-items:center;justify-content:center;border-radius:50%;-webkit-appearance:none;transition:transform .18s cubic-bezier(.34,1.56,.64,1),opacity .2s}
.cb:active{transform:scale(.8);opacity:.55}
.cb.dim{color:var(--t3)}
.cb.on{color:var(--acc)!important}
#ppbtn{width:68px;height:68px;background:rgba(255,255,255,.95);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-appearance:none;box-shadow:0 12px 40px rgba(0,0,0,.45);transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
#ppbtn:active{transform:scale(.87)}
#ppbtn svg{color:#000}
#vrow{display:flex;align-items:center;gap:10px;padding:6px 0 2px}
.vico{color:var(--t3);flex-shrink:0}
#vsl{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:rgba(255,255,255,.2);outline:none;cursor:pointer}
#vsl::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 1px 4px rgba(0,0,0,.3)}
#skrow{display:flex;align-items:center;justify-content:space-between;padding:4px 0 0}
.skb{border:none;background:none;cursor:pointer;color:var(--t3);display:flex;align-items:center;justify-content:center;-webkit-appearance:none;padding:8px;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.skb:active{transform:scale(.8)}
#spdbtn{border:none;background:rgba(255,255,255,.1);border-radius:var(--rf);padding:5px 13px;color:var(--t2);font-size:13px;font-weight:600;cursor:pointer;-webkit-appearance:none;font-family:var(--fn);transition:all .18s}
#spdbtn:active{transform:scale(.9)}

/* TOAST */
#toast{position:fixed;bottom:calc(var(--nav) + 12px);left:50%;transform:translateX(-50%) translateY(14px);background:rgba(18,18,18,.93);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:var(--rf);padding:9px 20px;font-size:13px;color:var(--t2);z-index:500;opacity:0;pointer-events:none;transition:all .25s;white-space:nowrap;max-width:calc(100vw - 48px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* REGION SHEET */
#rgs{position:fixed;inset:0;z-index:600;display:none;align-items:flex-end}
#rgs.show{display:flex}
#rgs-bg{position:absolute;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#rgs-card{position:relative;z-index:1;width:100%;background:#141414;border-radius:var(--r4) var(--r4) 0 0;padding-bottom:calc(var(--sb) + 16px);max-height:72vh;overflow:hidden;display:flex;flex-direction:column}
.rgs-hdl{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:12px auto 2px}
.rgs-ttl{font-size:17px;font-weight:700;padding:10px 20px 14px}
#rgs-lst{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 12px;display:flex;flex-direction:column;gap:2px}
.ro{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:var(--r2);cursor:pointer;transition:background .14s;font-size:15px}
.ro:active{background:rgba(255,255,255,.07)}
.ro.sel{color:var(--acc);font-weight:600}
.rof{font-size:22px;flex-shrink:0}

/* ANIM */
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fu .3s cubic-bezier(.32,.72,0,1) forwards;opacity:0}
</style>
</head>
<body>
<div id="orbs"><div class="orb" id="o1"></div><div class="orb" id="o2"></div><div class="orb" id="o3"></div></div>

<div id="app">

  <!-- HOME -->
  <div class="view active" id="home-view">
    <div class="scr">
      <div class="hg">
        <div class="hg-sub" id="greet">Good evening</div>
        <div class="hg-ttl">What's the vibe?</div>
      </div>
      <button id="rgn-btn" onclick="openRgn()">
        <span id="rgn-flag">🇧🇩</span><span id="rgn-name">Bangladesh</span>
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="sh"><div class="st">🔥 Trending</div></div>
      <div class="frow" id="feat-row"><div class="sk sk-fc"></div><div class="sk sk-fc"></div><div class="sk sk-fc"></div></div>
      <div class="sh"><div class="st">✨ Hot Right Now</div></div>
      <div class="grow" id="hot-row"><div class="sk sk-gc"></div><div class="sk sk-gc"></div><div class="sk sk-gc"></div><div class="sk sk-gc"></div></div>
      <div class="sh"><div class="st">🎭 Moods</div></div>
      <div class="grow" id="mood-row"></div>
      <div id="rec-sec" style="display:none">
        <div class="sh"><div class="st">🕐 Recently Played</div></div>
        <div id="rec-list"></div>
      </div>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="view" id="search-view">
    <div class="vh"><div class="vt">Search</div></div>
    <div id="sbox">
      <input id="sinput" type="search" placeholder="Songs, artists, YouTube URLs…" autocomplete="off" autocorrect="off" spellcheck="false">
      <button id="sclr">✕</button>
    </div>
    <div id="chips">
      <button class="chip on" data-f="all">All</button>
      <button class="chip" data-f="song">Songs</button>
      <button class="chip" data-f="artist">Artists</button>
      <button class="chip" data-f="album">Albums</button>
      <button class="chip" data-f="playlist">Playlists</button>
    </div>
    <div id="suggs"></div>
    <div class="scr" id="results">

// ── UTILS ──
const fmt=s=>{if(!s||isNaN(s))return'0:00';s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=String(s%60).padStart(2,'0'),mm=h?String(m).padStart(2,'0'):m;return h?`${h}:${mm}:${ss}`:`${mm}:${ss}`};
const thumb=(id,q='mqdefault')=>`https://i.ytimg.com/vi/${id}/${q}.jpg`;

const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a};

// ── OWN API (search/trending/suggestions only) ──
async function api(path,params={},ms=12000){
  const u=new URL('/api/'+path,location.origin);
  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,String(v)));
  const r=await fetch(u.toString(),{signal:AbortSignal.timeout(ms)});
  if(!r.ok)throw new Error('API '+r.status);
  const d=await r.json();
  if(d?.error)throw new Error(d.error);
  return d;
}

// ── STREAM — fetched client-side directly from Invidious (CORS-enabled) ──
// This matches how ytify works: stream URLs from browser→Invidious, not server→Invidious
// Invidious instances with CORS enabled — browser calls these directly
const INV_INSTANCES=[
  'https://inv.nadeko.net',
  'https://yt.artemislena.eu',
  'https://iv.melmac.space',
  'https://invidious.nerdvpn.de',
  'https://invidious.jing.rocks',
  'https://invidious.privacyredirect.com',
  'https://yt.drgnz.club',
  'https://invidious.fdn.fr',
];
let lastGoodInv=localStorage.getItem('ap_inv')||INV_INSTANCES[0];

async function getStream(id){
  const ordered=[lastGoodInv,...INV_INSTANCES.filter(x=>x!==lastGoodInv)];
  let lastErr='Unknown error';
  for(const base of ordered){
    try{
      const r=await fetch(`${base}/api/v1/videos/${id}?fields=title,author,lengthSeconds,adaptiveFormats`,{
        signal:AbortSignal.timeout(12000),
        headers:{'Accept':'application/json'},
      });
      if(!r.ok){lastErr=`${base} HTTP ${r.status}`;continue;}
      const d=await r.json();
      if(!d?.adaptiveFormats?.length){lastErr=`${base} no formats`;continue;}
      const streams=d.adaptiveFormats
        .filter(f=>f.type?.startsWith('audio/')&&f.url)
        .sort((a,b)=>parseInt(b.bitrate||0)-parseInt(a.bitrate||0));
      if(!streams.length){lastErr=`${base} no audio`;continue;}
      lastGoodInv=base;
      localStorage.setItem('ap_inv',base);
      const picked=streams[Math.min(1,streams.length-1)];
      return{
        audioUrl:picked.url,
        title:d.title||'',
        author:(d.author||'').replace(' - Topic',''),
        duration:d.lengthSeconds||0,
      };
    }catch(e){
      lastErr=`${base}: ${e.message}`;
      console.warn('[stream]',lastErr);
    }
  }
  throw new Error('Audio unavailable. Try again or try a different song.');
}

// ── PLAY ──
async function playTrack(id,info={}){
  if(!id)return;
  if(S.id&&S.track)S.history.unshift({id:S.id,...S.track});
  if(S.history.length>60)S.history.pop();
  S.id=id;S.playing=false;
  const title=info.title||'Loading…',author=info.author||'';
  D.mTtl.textContent=title;D.mAth.textContent=author||'—';D.mini.classList.add('show');
  D.pttl.textContent=title;D.path.textContent=author;
  setArt(id);
  if(!S.playerOpen)openPlayer();
  toast('⏳ Loading…');D.art.className='loading';
  try{
    const data=await getStream(id);
    const t=data.title||title,a=(data.author||author||'').replace(' - Topic',''),dur=data.duration||0;
    S.track={title:t,author:a,duration:dur,id};
    D.mTtl.textContent=t;D.mAth.textContent=a||'—';
    D.pttl.textContent=t;D.path.textContent=a;
    if(dur){D.pbar.max=dur;D.tt.textContent=fmt(dur);}
    setArt(id);setMS(t,a,id,dur);
    document.title=t+' — Applify';
    savePH(id,t,a);
    const lk=S.liked.has(id);D.lkbtn.classList.toggle('on',lk);D.lkico.setAttribute('fill',lk?'currentColor':'none');
    audio.src=data.audioUrl;audio.playbackRate=SPEEDS[S.spdIdx];audio.load();
    await audio.play().catch(()=>{});
  }catch(e){toast('⚠ '+e.message,4000);D.art.className='';updateIcons();}
}

window.playTrack=playTrack;

  const u=thumb(id,'hqdefault');

}

const pPath='<path d="M8 5v14l11-7z"/>',pausePath='<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';

window.toggleLoop=()=>{S.loop=!S.loop;audio.loop=S.loop;$('loopbtn').classList.toggle('on',S.loop);toast(S.loop?'🔁 Loop on':'Loop off')};

window.cycleSpd=()=>{S.spdIdx=(S.spdIdx+1)%SPEEDS.length;const s=SPEEDS[S.spdIdx];audio.playbackRate=s;D.spdbtn.textContent=s+'×';toast(s+'× speed')};

window.openPlayer=()=>{if(!S.id)return;S.playerOpen=true;D.player.style.display='flex';requestAnimationFrame(()=>D.player.classList.add('open'))};

}

// ── AUDIO EVENTS ──
audio.addEventListener('playing',()=>{S.playing=true;updateIcons();D.toast.classList.remove('show')});

// ── MEDIA SESSION ──
function setMS(title,author,id,dur){
  if(!('mediaSession'in navigator))return;
  const ms=navigator.mediaSession;
  ms.metadata=new MediaMetadata({title,artist:author,artwork:[{src:thumb(id,'mqdefault'),sizes:'320x180'},{src:thumb(id,'hqdefault'),sizes:'480x360'},{src:thumb(id,'maxresdefault'),sizes:'1280x720'}]});
  ms.setActionHandler('play',()=>audio.play());
  ms.setActionHandler('pause',()=>audio.pause());
  ms.setActionHandler('nexttrack',skipNext);
  ms.setActionHandler('previoustrack',skipPrev);
  ms.setActionHandler('seekbackward',d=>seek(-(d.seekOffset||15)));
  ms.setActionHandler('seekforward',d=>seek(d.seekOffset||15));
  try{ms.setActionHandler('seekto',d=>{if(d.seekTime!=null)audio.currentTime=d.seekTime})}catch{}
}
audio.addEventListener('timeupdate',()=>{const ms=navigator.mediaSession;if(!ms||!audio.duration||!isFinite(audio.duration))return;try{ms.setPositionState({duration:audio.duration,playbackRate:audio.playbackRate,position:audio.currentTime})}catch{}},{passive:true});

// ── SEARCH ──
let sAC,sugT;
D.sinput.addEventListener('input',()=>{
  const q=D.sinput.value.trim();
  D.sclr.classList.toggle('show',q.length>0);
  if(ytId(q)){hideSugg();toast('YouTube URL detected — tap Enter');return;}
  clearTimeout(sugT);
  if(q.length>1)sugT=setTimeout(()=>loadSugg(q),320);else hideSugg();
});
D.sinput.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;e.preventDefault();
  const q=D.sinput.value.trim(),id=ytId(q);
  if(id){playTrack(id,{title:'YouTube Video',author:''});D.sinput.blur();}
  else if(q){runSearch(q,S.filter);hideSugg();D.sinput.blur();}
});
D.sclr.addEventListener('click',()=>{D.sinput.value='';D.sclr.classList.remove('show');hideSugg();D.results.innerHTML='<div class="empty"><div class="ei">🎵</div><div class="et">Applify</div><div class="es">Search or paste a YouTube URL</div></div>';D.sinput.focus()});
$$('.chip').forEach(c=>c.addEventListener('click',()=>{$$('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');S.filter=c.dataset.f;const q=D.sinput.value.trim();if(q&&!ytId(q))runSearch(q,S.filter)}));

async function loadSugg(q){
  try{const items=await api('search-suggestions',{q,music:'true'},5000);if(!Array.isArray(items)||!items.length){hideSugg();return;}D.suggs.innerHTML=items.slice(0,5).map(s=>`<div class="sg" onclick="pickSugg('${esc(s)}')"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><span>${esc(s)}</span></div>`).join('');D.suggs.classList.add('show');}catch{hideSugg();}
}
function hideSugg(){D.suggs.classList.remove('show');D.suggs.innerHTML='';}
window.pickSugg=t=>{D.sinput.value=t;D.sclr.classList.add('show');hideSugg();runSearch(t,S.filter);D.sinput.blur()};

async function runSearch(q,filter){
  if(sAC)sAC.abort();sAC=new AbortController();
  D.results.innerHTML='<div class="ld"><div class="sp"></div><div class="sp-t">Searching…</div></div>';
  try{
    const items=await api('search',{q,filter},12000);
    if(!items?.length){D.results.innerHTML='<div class="empty"><div class="ei">🔍</div><div class="et">No results</div><div class="es">Try a different search term</div></div>';return;}
    S.results=items;
    D.results.innerHTML=items.map((it,i)=>{const id=it.id;if(!id)return'';const t=it.title||'Unknown',a=(it.author||'').replace(' - Topic','');return`<div class="ti fu ${id===S.id?'np':''}" style="animation-delay:${i*.04}s" onclick="playItem(${i})"><img src="${thumb(id)}" alt="" loading="lazy" onerror="this.style.opacity='.2'" style="width:54px;height:54px;border-radius:10px;object-fit:cover;background:var(--t4);flex-shrink:0"><div class="ti-inf"><div class="ttl">${esc(t)}</div><div class="meta">${esc(a)}</div></div>${it.duration?`<div class="dur">${esc(it.duration)}</div>`:''}</div>`;}).join('');
  }catch(e){if(e.name==='AbortError')return;D.results.innerHTML=`<div class="empty"><div class="ei">⚠️</div><div class="et">Search failed</div><div class="es">${esc(e.message)}</div></div>`;}
}
window.playItem=i=>{const it=S.results[i];if(!it?.id)return;const t=it.title||'Unknown',a=(it.author||'').replace(' - Topic','');const rest=S.results.slice(i+1).filter(x=>x.id).map(x=>({id:x.id,title:x.title||'Unknown',author:(x.author||'').replace(' - Topic','')}));S.queue=S.shuffle?shuf(rest):rest;playTrack(it.id,{title:t,author:a})};

// ── HOME ──
function updateGreet(){const h=new Date().getHours();$('greet').textContent=h<5?'🌙 Late night':h<12?'Good morning':h<17?'Good afternoon':h<21?'Good evening':'🌙 Good night';}
function savePH(id,title,author){let h=JSON.parse(localStorage.getItem('ap_ph')||'[]');h=h.filter(i=>i.id!==id);h.unshift({id,title,author});localStorage.setItem('ap_ph',JSON.stringify(h.slice(0,30)));}
function renderRecent(){
  const h=JSON.parse(localStorage.getItem('ap_ph')||'[]');
  const sec=$('rec-sec'),lst=$('rec-list');
  if(!h.length){sec.style.display='none';return;}
  sec.style.display='block';
  lst.innerHTML=h.slice(0,8).map(i=>`<div class="ri" onclick="playTrack('${esc(i.id)}',{title:${JSON.stringify(i.title)},author:${JSON.stringify(i.author)}})" ><img src="${thumb(i.id)}" alt="" loading="lazy"><div class="ri-inf"><div class="ri-ttl">${esc(i.title)}</div><div class="ri-sub">${esc(i.author)}</div></div><button class="ri-pb"><svg width="13" height="13" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button></div>`).join('');
}
async function loadHome(){
  updateGreet();renderRecent();
  $('mood-row').innerHTML=MOODS.map(m=>`<div class="mc" onclick="searchMood('${esc(m.q)}','${esc(m.l)}')"><div class="mc-img" style="background:${m.c}">${m.e}</div><div class="mc-lbl">${m.l}</div></div>`).join('');
  $('feat-row').innerHTML='<div class="sk sk-fc"></div><div class="sk sk-fc"></div><div class="sk sk-fc"></div>';
  $('hot-row').innerHTML='<div class="sk sk-gc"></div><div class="sk sk-gc"></div><div class="sk sk-gc"></div><div class="sk sk-gc"></div>';
  try{
    const items=await api('trending',{region:S.region},15000);
    if(!items?.length)throw new Error('empty');
    $('feat-row').innerHTML=items.slice(0,5).map((it,i)=>{if(!it.id)return'';return`<div class="fc" onclick="playTrack('${esc(it.id)}',{title:${JSON.stringify(it.title||'')},author:${JSON.stringify((it.author||'').replace(' - Topic',''))}})" ><img src="${thumb(it.id,'hqdefault')}" alt="" loading="lazy" onerror="this.style.opacity='.3'"><div class="fc-bdg">${BDGS[i%BDGS.length]}</div><div class="fc-ov"><div class="fc-ttl">${esc(it.title||'')}</div><div class="fc-ath">${esc((it.author||'').replace(' - Topic',''))}</div></div></div>`;}).join('');
    $('hot-row').innerHTML=items.slice(5,13).map(it=>{if(!it.id)return'';return`<div class="gc" onclick="playTrack('${esc(it.id)}',{title:${JSON.stringify(it.title||'')},author:${JSON.stringify((it.author||'').replace(' - Topic',''))}})" ><img src="${thumb(it.id)}" alt="" loading="lazy" onerror="this.style.opacity='.3'"><div class="gc-ttl">${esc(it.title||'')}</div><div class="gc-sub">${esc((it.author||'').replace(' - Topic',''))}</div></div>`;}).join('');
  }catch{$('feat-row').innerHTML='<div style="padding:20px;color:var(--t3);font-size:14px">Couldn\'t load trending</div>';$('hot-row').innerHTML='';}
}
window.searchMood=(q,l)=>{goTab('search');D.sinput.value=l;D.sclr.classList.add('show');runSearch(q,'all')};

// ── SCROLL / KEYBOARD ──
document.addEventListener('touchmove',e=>{if(!e.target.closest('.scr,.frow,.grow,#pbar,#vsl'))e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();togglePlay();}if(e.code==='ArrowLeft')seek(-15);if(e.code==='ArrowRight')seek(15);if(e.code==='Escape')closePlayer()});

// ── SERVICE WORKER ──
if('serviceWorker'in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});setInterval(()=>navigator.serviceWorker.ready.then(r=>r.active?.postMessage('ping')).catch(()=>{}),20000);}

// ── iOS HINT ──
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone)setTimeout(()=>toast('📲 Share → Add to Home Screen for background play',5000),4000);

// ── URL PARAMS ──
(()=>{const p=new URLSearchParams(location.search);const id=p.get('v')||ytId(p.get('url')||'');if(id)setTimeout(()=>playTrack(id,{title:'Loading…',author:''}),600)})();

// ── INIT ──
loadHome();
console.log('🎵 Applify v3 — all systems go');
</script>
