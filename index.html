<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Applify">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Applify — Beautiful YouTube Music Player">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23000'/><text y='.9em' font-size='80' x='10'>🎵</text></svg>">
  <link rel="manifest" href="/manifest.json">
  <title>Applify</title>
  <style>
    /* ===== FONTS ===== */
    @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    /* ===== CSS VARIABLES ===== */
    :root {
      --safe-top: env(safe-area-inset-top, 44px);
      --safe-bottom: env(safe-area-inset-bottom, 34px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);

      --glass-bg: rgba(255,255,255,0.08);
      --glass-border: rgba(255,255,255,0.18);
      --glass-shadow: 0 8px 32px rgba(0,0,0,0.4);
      --glass-blur: blur(24px) saturate(180%);

      --accent: #007AFF;
      --accent2: #5856D6;
      --danger: #FF3B30;
      --success: #34C759;

      --text-primary: rgba(255,255,255,0.95);
      --text-secondary: rgba(255,255,255,0.55);
      --text-tertiary: rgba(255,255,255,0.32);

      --bg-primary: #000000;
      --bg-secondary: rgba(255,255,255,0.04);

      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --radius-xl: 30px;
      --radius-full: 9999px;

      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;

      --nav-height: 82px;
      --art-color: #1a1a2e;
    }

    /* ===== RESET ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { height: 100%; overscroll-behavior: none; }
    body {
      font-family: var(--font);
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100%;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* ===== ANIMATED BACKGROUND ===== */
    #bg-orbs {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: orbFloat 12s ease-in-out infinite;
      will-change: transform;
    }
    .orb-1 { width: 350px; height: 350px; top: -80px; right: -80px; background: var(--art-color); animation-delay: 0s; animation-duration: 14s; }
    .orb-2 { width: 280px; height: 280px; bottom: 100px; left: -60px; background: rgba(88, 86, 214, 0.6); animation-delay: -4s; animation-duration: 11s; }
    .orb-3 { width: 200px; height: 200px; top: 40%; left: 30%; background: rgba(0,122,255,0.5); animation-delay: -7s; animation-duration: 16s; }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.08); }
      66% { transform: translate(-20px, 15px) scale(0.94); }
    }

    /* ===== APP SHELL ===== */
    #app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      z-index: 1;
    }

    /* ===== VIEWS ===== */
    .view {
      display: none;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }
    .view.active { display: flex; }

    /* ===== GLASS CARD ===== */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
    }
    .glass-subtle {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px) saturate(150%);
      -webkit-backdrop-filter: blur(12px) saturate(150%);
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* ===== LIQUID BUTTON ===== */
    .liquid-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      cursor: pointer;
      color: var(--text-primary);
      transition: all 0.18s cubic-bezier(0.34,1.56,0.64,1);
      -webkit-appearance: none;
      outline: none;
    }
    .liquid-btn:active { transform: scale(0.92); opacity: 0.7; }

    /* ===== SCROLLABLE LIST ===== */
    .scroll-list {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      flex: 1;
    }
    .scroll-list::-webkit-scrollbar { display: none; }

    /* ===== NAV BAR ===== */
    #navbar {
      position: relative;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-around;
      height: var(--nav-height);
      padding-bottom: var(--safe-bottom);
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border-top: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 16px;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--text-tertiary);
      transition: color 0.2s, transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
      -webkit-appearance: none;
    }
    .nav-btn.active { color: var(--accent); }
    .nav-btn:active { transform: scale(0.88); }
    .nav-btn svg { width: 24px; height: 24px; }
    .nav-btn span { font-size: 10px; font-weight: 500; letter-spacing: 0.2px; }

    /* ===== MINI PLAYER ===== */
    #mini-player {
      display: none;
      margin: 8px 12px 0;
      border-radius: var(--radius-lg);
      overflow: hidden;
      position: relative;
      z-index: 50;
      flex-shrink: 0;
    }
    #mini-player.visible { display: block; }
    #mini-player-inner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: var(--radius-lg);
      cursor: pointer;
    }
    #mini-art {
      width: 40px; height: 40px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      background: rgba(255,255,255,0.1);
    }
    #mini-info { flex: 1; overflow: hidden; }
    #mini-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #mini-author { font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    #mini-controls { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
    .mini-btn { width: 34px; height: 34px; border: none; cursor: pointer; }
    #mini-progress {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: rgba(255,255,255,0.15);
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    }
    #mini-progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      border-radius: inherit;
      transition: width 1s linear;
    }

    /* ===== SEARCH VIEW ===== */
    #search-view {
      padding-top: var(--safe-top);
    }
    .view-header {
      padding: 16px 20px 12px;
      flex-shrink: 0;
    }
    .view-title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 14px;
    }

    /* ===== SEARCH INPUT ===== */
    #search-wrap {
      position: relative;
    }
    #search-input {
      width: 100%;
      padding: 12px 44px 12px 16px;
      border-radius: var(--radius-full);
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 16px;
      font-weight: 400;
      outline: none;
      transition: all 0.2s;
      -webkit-appearance: none;
    }
    #search-input:focus {
      border-color: rgba(0,122,255,0.6);
      background: rgba(255,255,255,0.12);
      box-shadow: 0 0 0 3px rgba(0,122,255,0.15);
    }
    #search-input::placeholder { color: var(--text-tertiary); }
    #search-clear {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      display: none;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      border: none;
      cursor: pointer;
      color: var(--text-primary);
      font-size: 14px;
      align-items: center;
      justify-content: center;
      -webkit-appearance: none;
    }
    #search-clear.visible { display: flex; }

    /* ===== FILTER CHIPS ===== */
    #filter-row {
      display: flex;
      gap: 8px;
      padding: 10px 20px;
      overflow-x: auto;
      flex-shrink: 0;
    }
    #filter-row::-webkit-scrollbar { display: none; }
    .filter-chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.07);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-appearance: none;
    }
    .filter-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .filter-chip:active { transform: scale(0.94); }

    /* ===== SUGGESTIONS ===== */
    #suggestions {
      display: none;
      flex-direction: column;
      padding: 8px 12px;
      gap: 2px;
    }
    #suggestions.visible { display: flex; }
    .suggestion-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background 0.15s;
    }
    .suggestion-item:active { background: rgba(255,255,255,0.06); }
    .suggestion-item svg { width: 16px; height: 16px; color: var(--text-tertiary); flex-shrink: 0; }
    .suggestion-item span { font-size: 15px; color: var(--text-primary); }

    /* ===== RESULTS ===== */
    #results {
      flex: 1;
      padding: 8px 12px 12px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    #results::-webkit-scrollbar { display: none; }

    /* ===== TRACK ITEM ===== */
    .track-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background 0.15s;
      position: relative;
    }
    .track-item:active { background: rgba(255,255,255,0.06); }
    .track-thumb {
      width: 52px; height: 52px;
      border-radius: 10px;
      object-fit: cover;
      background: rgba(255,255,255,0.08);
      flex-shrink: 0;
    }
    .track-info { flex: 1; overflow: hidden; }
    .track-title {
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }
    .track-meta {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-duration {
      font-size: 12px;
      color: var(--text-tertiary);
      flex-shrink: 0;
    }
    .track-item.playing .track-title { color: var(--accent); }

    /* ===== LOADING ===== */
    .loading-spinner {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      flex-direction: column;
      gap: 16px;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 2.5px solid rgba(255,255,255,0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: var(--text-tertiary); }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 60px 32px;
      text-align: center;
    }
    .empty-icon { font-size: 48px; opacity: 0.5; }
    .empty-title { font-size: 18px; font-weight: 600; color: var(--text-secondary); }
    .empty-sub { font-size: 14px; color: var(--text-tertiary); line-height: 1.5; }

    /* ===== PLAYER VIEW ===== */
    #player-view {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.45s cubic-bezier(0.32, 0.72, 0, 1);
    }
    #player-view.open {
      display: flex;
      transform: translateY(0);
    }

    /* Player BG */
    #player-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    #player-bg-img {
      position: absolute;
      inset: -40px;
      background-size: cover;
      background-position: center;
      filter: blur(60px) brightness(0.35) saturate(2);
      transform: scale(1.3);
      transition: background-image 0.8s;
    }
    #player-bg-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.2) 0%,
        rgba(0,0,0,0.1) 40%,
        rgba(0,0,0,0.7) 80%,
        rgba(0,0,0,0.9) 100%
      );
    }

    #player-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 0 24px;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--safe-bottom) + 16px);
      overflow: hidden;
    }

    /* Player Header */
    #player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0 20px;
    }
    .player-header-btn {
      width: 36px; height: 36px;
      border: none;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 50%;
      cursor: pointer;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-appearance: none;
      transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1);
    }
    .player-header-btn:active { transform: scale(0.88); }
    #player-header-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    /* Artwork */
    #artwork-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 0;
      min-height: 0;
    }
    #artwork {
      width: min(100%, 320px);
      aspect-ratio: 1;
      border-radius: var(--radius-xl);
      object-fit: cover;
      box-shadow: 0 24px 80px rgba(0,0,0,0.7), 0 8px 24px rgba(0,0,0,0.4);
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
      background: rgba(255,255,255,0.08);
    }
    #artwork.loading { transform: scale(0.92); opacity: 0.6; }
    #artwork.playing { transform: scale(1); }
    #artwork.paused { transform: scale(0.93); }

    /* Track Info */
    #track-info-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
    }
    #track-info { flex: 1; overflow: hidden; }
    #player-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #player-author {
      font-size: 15px;
      color: var(--text-secondary);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #like-btn {
      width: 36px; height: 36px;
      border: none; background: none; cursor: pointer;
      color: var(--text-tertiary);
      display: flex; align-items: center; justify-content: center;
      -webkit-appearance: none;
      flex-shrink: 0;
      transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), color 0.2s;
    }
    #like-btn.liked { color: var(--danger); }
    #like-btn:active { transform: scale(0.8); }

    /* Progress / Slider */
    #progress-wrap { padding: 8px 0 4px; }
    #progress-bar {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.2);
      outline: none;
      cursor: pointer;
    }
    #progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: transform 0.15s;
    }
    #progress-bar:active::-webkit-slider-thumb { transform: scale(1.3); }
    #progress-bar::-webkit-slider-runnable-track { border-radius: 2px; }
    #time-row {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
    }
    .time-label { font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }

    /* Controls */
    #controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0 8px;
    }
    .ctrl-btn {
      width: 48px; height: 48px;
      border: none; background: none; cursor: pointer;
      color: var(--text-primary);
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), opacity 0.2s;
      -webkit-appearance: none;
    }
    .ctrl-btn:active { transform: scale(0.84); opacity: 0.6; }
    .ctrl-btn.dim { color: var(--text-tertiary); }
    #play-pause-btn {
      width: 70px; height: 70px;
      background: rgba(255,255,255,0.95);
      border: none; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-appearance: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1);
    }
    #play-pause-btn:active { transform: scale(0.9); }
    #play-pause-btn svg { color: #000; }

    /* Volume & Options Row */
    #options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0 4px;
      gap: 12px;
    }
    .opt-btn {
      border: none; background: none; cursor: pointer;
      color: var(--text-tertiary);
      display: flex; align-items: center; justify-content: center;
      -webkit-appearance: none;
      transition: color 0.2s, transform 0.18s cubic-bezier(0.34,1.56,0.64,1);
    }
    .opt-btn:active { transform: scale(0.84); }
    .opt-btn.active { color: var(--accent); }

    #vol-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.2);
      outline: none;
      cursor: pointer;
    }
    #vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    /* ===== QUEUE VIEW ===== */
    #queue-view {
      padding-top: var(--safe-top);
    }
    .queue-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background 0.15s;
    }
    .queue-item:active { background: rgba(255,255,255,0.06); }
    .queue-num {
      width: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--text-tertiary);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .queue-num.now-playing { color: var(--accent); font-size: 10px; }

    /* ===== STATUS BAR ===== */
    #status-bar {
      position: fixed;
      bottom: calc(var(--nav-height) + 4px);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: var(--radius-full);
      padding: 8px 20px;
      font-size: 13px;
      color: var(--text-secondary);
      z-index: 300;

<script>
'use strict';

// ===== STATE =====
const state = {
  currentId: null,
  currentTrack: null,
  isPlaying: false,
  isLooping: false,
  isShuffling: false,
  currentTime: 0,
  duration: 0,
  queue: [],
  history: [],
  liked: new Set(JSON.parse(localStorage.getItem('liked') || '[]')),
  searchFilter: 'all',
  playerOpen: false,
  searchResults: [],
  proxyIndex: 0,
  volume: parseFloat(localStorage.getItem('volume') || '1'),
};

// Invidious instances (fallback chain)
const INSTANCES = [
  'https://yt.omada.cafe',
  'https://lekker.gay',
  'https://iv.melmac.space',
  'https://invidious.jing.rocks',
];

// API endpoint (ytify's worker for search)
const API = 'https://api.ytify.workers.dev';

// Audio element
const audio = new Audio();
audio.crossOrigin = 'anonymous';
audio.volume = state.volume;
audio.preload = 'auto';

// ===== DOM REFS =====
const $ = id => document.getElementById(id);
const $$ = sel => document.querySelectorAll(sel);

const els = {
  searchInput: $('search-input'),
  searchClear: $('search-clear'),
  suggestions: $('suggestions'),
  results: $('results'),
  emptyState: $('empty-state'),
  miniPlayer: $('mini-player'),
  miniArt: $('mini-art'),
  miniTitle: $('mini-title'),
  miniAuthor: $('mini-author'),
  miniPlayIcon: $('mini-play-icon'),
  miniProgressFill: $('mini-progress-fill'),
  playerView: $('player-view'),
  playerBgImg: $('player-bg-img'),
  artwork: $('artwork'),
  playerTitle: $('player-title'),
  playerAuthor: $('player-author'),
  progressBar: $('progress-bar'),
  timeCurrent: $('time-current'),
  timeTotal: $('time-total'),
  playIcon: $('play-icon'),
  likeIcon: $('like-icon'),
  likeBtn: $('like-btn'),
  statusBar: $('status-bar'),
  queueList: $('queue-list'),
  volSlider: $('vol-slider'),
};

// ===== HELPERS =====
function fmt(s) {
  if (!s || isNaN(s)) return '0:00';
  s = Math.floor(s);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  const ss = String(sec).padStart(2, '0');
  const mm = h ? String(m).padStart(2, '0') : m;
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

function thumb(id, size = 'mqdefault') {
  return `https://i.ytimg.com/vi/${id}/${size}.jpg`;
}

function idFromURL(url) {
  if (!url) return null;
  const m = url.match(/(?:youtube\.com.*[?&]v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

let statusTimeout;
function showStatus(msg, duration = 2500) {
  els.statusBar.textContent = msg;
  els.statusBar.classList.add('visible');
  clearTimeout(statusTimeout);
  statusTimeout = setTimeout(() => els.statusBar.classList.remove('visible'), duration);
}

function saveLiked() {
  localStorage.setItem('liked', JSON.stringify([...state.liked]));
}

// ===== AUDIO / STREAM =====
async function getStreamURL(videoId) {
  const instances = INSTANCES;
  for (let i = 0; i < instances.length; i++) {
    const inst = instances[(state.proxyIndex + i) % instances.length];
    try {
      const res = await fetch(`${inst}/api/v1/videos/${videoId}`, { signal: AbortSignal.timeout(8000) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data.adaptiveFormats) throw new Error('No formats');

      const audioStreams = data.adaptiveFormats
        .filter(f => f.type && f.type.startsWith('audio'))
        .sort((a, b) => parseInt(b.bitrate) - parseInt(a.bitrate));

      if (!audioStreams.length) throw new Error('No audio streams');

      // Pick medium quality
      const stream = audioStreams[Math.floor(audioStreams.length / 2)] || audioStreams[0];
      state.proxyIndex = (state.proxyIndex + i) % instances.length;
      return { url: stream.url, data };
    } catch (e) {
      console.warn(`Instance ${inst} failed:`, e.message);
    }
  }
  throw new Error('All instances failed. Try again.');
}

async function playTrack(id, trackInfo = null) {
  if (!id) return;

  // Add current to history
  if (state.currentId && state.currentTrack) {
    state.history.unshift({ id: state.currentId, ...state.currentTrack });
    if (state.history.length > 50) state.history.pop();
  }

  state.currentId = id;
  state.isPlaying = false;

  updateArtwork(id);
  updateMiniPlayer({ title: trackInfo?.title || 'Loading…', author: trackInfo?.author || '…', id });
  updatePlayerUI({ title: trackInfo?.title || 'Loading…', author: trackInfo?.author || '…' });
  showStatus('Loading…');
  els.artwork.className = 'loading';

  if (!state.playerOpen) openPlayer();

  try {
    const { url, data } = await getStreamURL(id);

    // Update metadata from API response
    const title = data.title || trackInfo?.title || 'Unknown';
    const author = (data.author || trackInfo?.author || 'Unknown').replace(' - Topic', '');
    const duration = data.lengthSeconds || 0;

    state.currentTrack = { title, author, duration, id };

    updateArtwork(id);
    updateMiniPlayer({ title, author, id });
    updatePlayerUI({ title, author, duration });
    updateMediaSession(title, author, id, duration);

    document.title = `${title} — Applify`;

    audio.src = url;
    audio.load();
    audio.play().catch(e => console.warn('Autoplay blocked:', e));

    // Update orb color based on artwork
    updateOrbColor(id);

  } catch (e) {
    showStatus('⚠ ' + e.message);
    els.artwork.className = '';
    state.isPlaying = false;
    updatePlayIcons();
  }
}

function updateArtwork(id) {

window.seek = function(delta) {
  audio.currentTime = Math.max(0, Math.min(audio.currentTime + delta, audio.duration || 0));
};

window.toggleLoop = function() {
  state.isLooping = !state.isLooping;
  audio.loop = state.isLooping;
  $('loop-btn').classList.toggle('active', state.isLooping);
  $('loop-btn').style.color = state.isLooping ? 'var(--accent)' : '';
  showStatus(state.isLooping ? 'Loop on' : 'Loop off');
};

window.toggleShuffle = function() {
  state.isShuffling = !state.isShuffling;
  $('shuffle-btn').classList.toggle('active', state.isShuffling);
  $('shuffle-btn').style.color = state.isShuffling ? 'var(--accent)' : '';
  if (state.isShuffling && state.queue.length > 1) {
    state.queue = shuffleArr([...state.queue]);
    renderQueue();
  }
  showStatus(state.isShuffling ? 'Shuffle on' : 'Shuffle off');
};

window.skipNext = function() {
  if (!state.queue.length) return;
  const next = state.queue.shift();
  renderQueue();
  playTrack(next.id, next);
};

window.skipPrev = function() {
  if (!state.history.length) {
    audio.currentTime = 0;
    return;
  }
  const prev = state.history.shift();
  // Put current back in queue front
  if (state.currentId && state.currentTrack) {
    state.queue.unshift({ id: state.currentId, ...state.currentTrack });
  }
  playTrack(prev.id, prev);
  renderQueue();
};

window.toggleLike = function() {
  if (!state.currentId) return;
  if (state.liked.has(state.currentId)) {
    state.liked.delete(state.currentId);
    showStatus('Removed from likes');
  } else {
    state.liked.add(state.currentId);
    showStatus('❤ Added to likes');

function addToQueue(tracks) {
  if (state.isShuffling) {
    state.queue.push(...shuffleArr([...tracks]));
  } else {
    state.queue.push(...tracks);
  }
}

function renderQueue() {
  const list = els.queueList;
  if (!state.queue.length && !state.currentId) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">🎶</div><div class="empty-title">Queue is empty</div><div class="empty-sub">Search for music to add to your queue</div></div>`;
    return;
  }

  let html = '';
  if (state.currentId && state.currentTrack) {
    html += `<div style="padding:8px 12px 4px;font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:0.8px">Now Playing</div>`;
    html += `<div class="queue-item" onclick="playTrack('${state.currentId}', ${JSON.stringify(state.currentTrack).replace(/"/g, '&quot;')})">
      <div class="queue-num now-playing">▶</div>
      <img class="track-thumb" src="${thumb(state.currentId)}" style="width:44px;height:44px" alt="">
      <div class="track-info">
        <div class="track-title" style="color:var(--accent)">${esc(state.currentTrack.title || '')}</div>
        <div class="track-meta">${esc(state.currentTrack.author || '')}</div>
      </div>
    </div>`;
  }
  if (state.queue.length) {
    html += `<div style="padding:12px 12px 4px;font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.8px">Up Next</div>`;
    state.queue.forEach((t, i) => {
      html += `<div class="queue-item" onclick="playFromQueue(${i})">
        <div class="queue-num">${i + 1}</div>
        <img class="track-thumb" src="${thumb(t.id)}" style="width:44px;height:44px" alt="">
        <div class="track-info">
          <div class="track-title">${esc(t.title || '')}</div>
          <div class="track-meta">${esc(t.author || '')}</div>
        </div>
      </div>`;
    });
  }
  list.innerHTML = html;
}

window.playFromQueue = function(idx) {
  const track = state.queue.splice(idx, 1)[0];
  if (track) playTrack(track.id, track);
  renderQueue();
};

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function shuffleArr(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

async function doSearch(q, filter) {
  if (abortCtrl) abortCtrl.abort();
  abortCtrl = new AbortController();

  // Hide empty, show loading
  els.results.innerHTML = `<div class="loading-spinner"><div class="spinner"></div><div class="loading-text">Searching…</div></div>`;

  try {
    const url = `${API}/search?q=${encodeURIComponent(q)}&f=${filter === 'all' ? 'relevance' : filter}`;
    const res = await fetch(url, { signal: abortCtrl.signal });
    if (!res.ok) throw new Error('Search failed');
    const items = await res.json();

    if (!items || !items.length) {
      els.results.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">No results</div><div class="empty-sub">Try a different search term</div></div>`;
      return;
    }

    renderResults(items);
    state.searchResults = items;
  } catch (e) {
    if (e.name === 'AbortError') return;
    els.results.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Search failed</div><div class="empty-sub">${esc(e.message)}</div></div>`;
  }
}

function renderResults(items) {
  const html = items.map((item, idx) => {
    const id = item.id || item.videoId;
    if (!id) return '';
    const title = item.title || 'Untitled';
    const author = (item.author || item.artist || '').replace(' - Topic', '');
    const duration = item.duration || '';
    const isPlaying = id === state.currentId;

    return `<div class="track-item fade-up ${isPlaying ? 'playing' : ''}" 
      style="animation-delay:${idx * 0.04}s"
      onclick="playItem(${idx})"
      data-idx="${idx}">
      <img class="track-thumb" src="${thumb(id)}" alt="" loading="lazy" onerror="this.style.opacity='0.3'">
      <div class="track-info">
        <div class="track-title">${esc(title)}</div>
        <div class="track-meta">${esc(author)}</div>
      </div>
      ${duration ? `<div class="track-duration">${esc(duration)}</div>` : ''}
    </div>`;
  }).join('');

  els.results.innerHTML = html;
}

window.playItem = function(idx) {
  const item = state.searchResults[idx];
  if (!item) return;
  const id = item.id || item.videoId;
  if (!id) return;

  const title = item.title || 'Unknown';
  const author = (item.author || item.artist || '').replace(' - Topic', '');
  const duration = item.duration || '';

  // Add rest to queue
  const rest = state.searchResults.slice(idx + 1).filter(t => t.id || t.videoId).map(t => ({
    id: t.id || t.videoId,
    title: t.title || 'Unknown',
    author: (t.author || t.artist || '').replace(' - Topic', ''),
    duration: t.duration || ''
  }));

  state.queue = state.isShuffling ? shuffleArr(rest) : rest;

  playTrack(id, { title, author, duration });
};

function showEmpty() {
  els.results.innerHTML = `<div class="empty-state" id="empty-state"><div class="empty-icon">🎵</div><div class="empty-title">Applify</div><div class="empty-sub">Search for music or paste a YouTube URL to start listening</div></div>`;
}

// ===== MEDIA SESSION =====
function updateMediaSession(title, author, id, duration) {
  if (!('mediaSession' in navigator)) return;
  const ms = navigator.mediaSession;
  ms.metadata = new MediaMetadata({
    title,
    artist: author,
    artwork: [
      { src: thumb(id, 'mqdefault'), sizes: '320x180', type: 'image/jpeg' },
      { src: thumb(id, 'hqdefault'), sizes: '480x360', type: 'image/jpeg' },
      { src: thumb(id, 'maxresdefault'), sizes: '1280x720', type: 'image/jpeg' },
    ]
  });

  ms.setActionHandler('play', () => audio.play());
  ms.setActionHandler('pause', () => audio.pause());
  ms.setActionHandler('nexttrack', skipNext);
  ms.setActionHandler('previoustrack', skipPrev);
  ms.setActionHandler('seekbackward', d => seek(-(d.seekOffset || 15)));
  ms.setActionHandler('seekforward', d => seek(d.seekOffset || 15));
  ms.setActionHandler('seekto', d => { if (d.seekTime != null) audio.currentTime = d.seekTime; });

  audio.addEventListener('timeupdate', () => {
    if ('setPositionState' in ms && audio.duration && isFinite(audio.duration)) {
      try {
        ms.setPositionState({ duration: audio.duration, playbackRate: audio.playbackRate, position: audio.currentTime });
      } catch (_) {}
    }
  }, { passive: true });
}

      const author = (item.author || '').replace(' - Topic', '');
      return `<div class="grid-card" onclick="playTrack('${esc(id)}', {title:'${esc(title).replace(/'/g,"\'")}',author:'${esc(author).replace(/'/g,"\'")}'})">
        <img class="grid-card-img" src="${thumb(id)}" alt="" loading="lazy" onerror="this.style.opacity='0.3'">
        <div class="grid-card-title">${esc(title)}</div>
        <div class="grid-card-sub">${esc(author)}</div>
      </div>`;
    }).join('');
  });

  // Render mood cards (static, instant)
  const moodsRow = $('moods-row');
  moodsRow.innerHTML = MOOD_CARDS.map(m =>
    `<div class="grid-card" onclick="searchMood('${esc(m.q)}','${esc(m.label)}')">
      <div class="grid-card-img" style="background:${m.color};display:flex;align-items:center;justify-content:center;font-size:48px">${m.emoji}</div>
      <div class="grid-card-title">${m.label}</div>
    </div>`
  ).join('');

  // Recently played
  renderRecentlyPlayed();
}

window.searchMood = function(q, label) {
  switchView('search');
  els.searchInput.value = label;
  els.searchClear.classList.add('visible');
  doSearch(q, 'all');
};

function renderRecentlyPlayed() {
  const history = JSON.parse(localStorage.getItem('playHistory') || '[]');
  const section = $('recent-section');
  const list = $('recent-list');
  if (!history.length) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  list.innerHTML = history.slice(0, 6).map(item =>
    `<div class="recent-item" onclick="playTrack('${esc(item.id)}', {title:'${esc((item.title||'').replace(/'/g,"\'"))}',author:'${esc((item.author||'').replace(/'/g,"\'"))'})">
      <img class="recent-img" src="${thumb(item.id)}" alt="" loading="lazy">
      <div class="recent-info">
        <div class="recent-title">${esc(item.title || 'Unknown')}</div>
        <div class="recent-sub">${esc(item.author || '')}</div>
      </div>
      <button class="recent-play-btn" aria-label="Play">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>`
  ).join('');
}

// Save to play history in localStorage
function saveToHistory(id, title, author) {
  const key = 'playHistory';
  let history = JSON.parse(localStorage.getItem(key) || '[]');
  history = history.filter(i => i.id !== id); // dedupe
  history.unshift({ id, title, author, ts: Date.now() });
  history = history.slice(0, 20);
  localStorage.setItem(key, JSON.stringify(history));
}

// Hook into playTrack to save history
const _origPlayTrack = playTrack;
// We'll patch after playTrack fully resolves — hook into audio playing event
audio.addEventListener('playing', () => {
  if (state.currentId && state.currentTrack) {
    saveToHistory(state.currentId, state.currentTrack.title, state.currentTrack.author);
  }
}, { passive: true });

// ===== PATCH switchView to reload home content when switching to home =====
const _origSwitchView = window.switchView;
window.switchView = function(view) {
  _origSwitchView(view);
  // Also handle home nav button active state
  $$('.nav-btn').forEach(b => b.classList.remove('active'));
  $('nav-' + view)?.classList.add('active');
  if (view === 'home') {
    updateGreeting();
    renderRecentlyPlayed();
  }
};

// Load home on startup
loadHomeContent();

// Touch scroll fix for home
document.addEventListener('touchmove', e => {
  if (e.target.closest('.home-scroll') || e.target.closest('.featured-scroll') || e.target.closest('.grid-scroll')) return;
}, { passive: true });

// ===== PREVENT SCROLL BOUNCE =====
document.addEventListener('touchmove', e => {
  if (!e.target.closest('.scroll-list') && !e.target.closest('#progress-bar') && !e.target.closest('#vol-slider')) {
    e.preventDefault();
  }
}, { passive: false });

// Prevent context menu on long press
document.addEventListener('contextmenu', e => e.preventDefault());

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowLeft') seek(-15);
  if (e.code === 'ArrowRight') seek(15);
  if (e.code === 'Escape') closePlayer();
});

// ===== PWA INSTALL (iOS hint) =====
window.addEventListener('load', () => {
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.navigator.standalone;

  if (isIOS && !isStandalone) {
    const hint = $('url-hint');
    hint.textContent = '📲 Tap Share → Add to Home Screen';
    hint.classList.add('visible');
    setTimeout(() => hint.classList.remove('visible'), 5000);
  }
});

console.log('🎵 Applify loaded — built with love');

// ===== SERVICE WORKER =====
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then(reg => {
    console.log('SW registered:', reg.scope);
  }).catch(e => console.warn('SW failed:', e));

  // Keep alive ping to maintain background audio
  setInterval(() => {
    navigator.serviceWorker.ready.then(reg => {
      if (reg.active) {
        const channel = new MessageChannel();
        reg.active.postMessage('keepalive', [channel.port2]);
      }
    }).catch(() => {});
  }, 20000);
}
</script>
