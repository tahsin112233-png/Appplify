<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Applify">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.json">
<title>Applify</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
:root{
  --st:env(safe-area-inset-top,44px);--sb:env(safe-area-inset-bottom,34px);
  --acc:#007AFF;--red:#FF3B30;--grn:#34C759;--ylw:#FF9500;
  --t1:rgba(255,255,255,.96);--t2:rgba(255,255,255,.55);--t3:rgba(255,255,255,.3);--t4:rgba(255,255,255,.1);
  --g1:rgba(255,255,255,.08);--g2:rgba(255,255,255,.16);
  --r1:10px;--r2:16px;--r3:22px;--r4:28px;--rf:999px;
  --nav:80px;--font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;overscroll-behavior:none}
body{font-family:var(--font);background:#000;color:var(--t1);height:100%;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}

/* ORBS */
#orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
.o1{width:420px;height:420px;top:-110px;right:-110px;background:rgba(0,100,200,.35);opacity:.6;animation:o1a 16s ease-in-out infinite}
.o2{width:300px;height:300px;bottom:60px;left:-70px;background:rgba(88,86,214,.45);opacity:.4;animation:o2a 13s ease-in-out infinite}
.o3{width:240px;height:240px;top:42%;left:20%;background:rgba(0,122,255,.3);opacity:.3;animation:o3a 19s ease-in-out infinite}
@keyframes o1a{0%,100%{transform:translate(0,0) scale(1)}40%{transform:translate(22px,-18px) scale(1.08)}70%{transform:translate(-14px,16px) scale(.94)}}
@keyframes o2a{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,-22px)}}
@keyframes o3a{0%,100%{transform:translate(0,0)}35%{transform:translate(-18px,14px)}68%{transform:translate(16px,-11px)}}

/* SHELL */
#app{position:fixed;inset:0;display:flex;flex-direction:column;z-index:1}
.view{display:none;flex-direction:column;flex:1;overflow:hidden;padding-top:var(--st)}
.view.active{display:flex}
.scr{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1}

/* NAV */
#nav{position:relative;z-index:100;display:flex;align-items:center;justify-content:space-around;height:var(--nav);padding-bottom:var(--sb);background:rgba(0,0,0,.7);backdrop-filter:blur(36px) saturate(200%);-webkit-backdrop-filter:blur(36px) saturate(200%);border-top:1px solid rgba(255,255,255,.1);flex-shrink:0}
.nb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 20px;border:none;background:none;color:var(--t3);cursor:pointer;-webkit-appearance:none;transition:color .2s,transform .2s cubic-bezier(.34,1.56,.64,1);font-family:var(--font);font-size:10px;font-weight:500}
.nb svg{width:22px;height:22px}.nb.on{color:var(--acc)}.nb:active{transform:scale(.86)}

/* MINI PLAYER */
#mini{display:none;margin:8px 12px 0;flex-shrink:0;position:relative;z-index:50;border-radius:var(--r3);overflow:hidden;cursor:pointer}
#mini.show{display:block}
#mini-in{display:flex;align-items:center;gap:12px;padding:10px 12px;background:rgba(255,255,255,.11);backdrop-filter:blur(32px) saturate(200%);-webkit-backdrop-filter:blur(32px) saturate(200%);border:1px solid rgba(255,255,255,.19);border-radius:var(--r3)}
#m-art{width:44px;height:44px;border-radius:9px;object-fit:cover;background:var(--t4);flex-shrink:0}
#m-info{flex:1;overflow:hidden}
#m-ttl{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#m-ath{font-size:11px;color:var(--t2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#m-ctrls{display:flex;gap:6px;flex-shrink:0}
.mb{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.13);color:var(--t1);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-appearance:none;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.mb:active{transform:scale(.82)}
#m-bar{position:absolute;bottom:0;left:0;right:0;height:2px;background:rgba(255,255,255,.1);border-radius:0 0 var(--r3) var(--r3)}
#m-fill{height:100%;background:var(--acc);width:0%;transition:width .8s linear;border-radius:inherit}

/* HOME */
.hg{padding:14px 20px 4px}
.hg-sub{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.9px;margin-bottom:3px}
.hg-ttl{font-size:30px;font-weight:800;letter-spacing:-.5px}
#rgn-btn{display:inline-flex;align-items:center;gap:7px;margin:10px 20px 4px;padding:6px 14px;border-radius:var(--rf);border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:var(--t2);font-size:13px;font-weight:500;cursor:pointer;-webkit-appearance:none;font-family:var(--font);transition:all .2s}
#rgn-btn:active{transform:scale(.93)}
.sh{display:flex;align-items:baseline;justify-content:space-between;padding:18px 20px 10px}
.st{font-size:19px;font-weight:700;letter-spacing:-.3px}
.frow{display:flex;gap:14px;padding:0 20px 4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.fc{flex-shrink:0;width:230px;height:148px;border-radius:var(--r3);overflow:hidden;position:relative;cursor:pointer;transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.fc:active{transform:scale(.94)}
.fc img{width:100%;height:100%;object-fit:cover}
.fc-ov{position:absolute;inset:0;background:linear-gradient(150deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.78) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:12px}
.fc-ttl{font-size:14px;font-weight:700;line-height:1.3;text-shadow:0 1px 5px rgba(0,0,0,.7)}
.fc-ath{font-size:11px;color:rgba(255,255,255,.68);margin-top:2px;text-shadow:0 1px 4px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-bdg{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.58);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);border-radius:var(--rf);padding:3px 8px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.grow{display:flex;gap:12px;padding:0 20px 4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.gc{flex-shrink:0;width:126px;cursor:pointer;transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.gc:active{transform:scale(.92)}
.gc-img{width:126px;height:126px;border-radius:var(--r2);object-fit:cover;background:var(--t4);display:block}
.gc-ttl{font-size:13px;font-weight:600;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-sub{font-size:11px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc{flex-shrink:0;width:126px;cursor:pointer;transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.mc:active{transform:scale(.92)}
.mc-bg{width:126px;height:126px;border-radius:var(--r2);display:flex;align-items:center;justify-content:center;font-size:52px}
.mc-lbl{font-size:13px;font-weight:600;margin-top:7px;text-align:center}
.ri{display:flex;align-items:center;gap:12px;padding:9px 20px;cursor:pointer;transition:background .14s}
.ri:active{background:rgba(255,255,255,.06)}
.ri-img{width:46px;height:46px;border-radius:9px;object-fit:cover;background:var(--t4);flex-shrink:0}
.ri-inf{flex:1;overflow:hidden}
.ri-ttl{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-sub{font-size:12px;color:var(--t2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-pb{width:32px;height:32px;border-radius:50%;border:none;background:rgba(255,255,255,.1);color:var(--t1);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;-webkit-appearance:none;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.ri-pb:active{transform:scale(.8)}
.sk{background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.05) 75%);background-size:200% 100%;animation:sk 1.4s infinite;border-radius:8px}
.sk-fc{width:230px;height:148px;border-radius:var(--r3);flex-shrink:0}
.sk-gc{width:126px;height:126px;border-radius:var(--r2);flex-shrink:0}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* SEARCH */
.v-hdr{padding:12px 20px 10px;flex-shrink:0}
.v-ttl{font-size:30px;font-weight:800;letter-spacing:-.5px}
#sbox{position:relative;margin:0 20px 10px}
#sinp{width:100%;padding:12px 42px 12px 16px;border-radius:var(--rf);border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.1);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--t1);font-family:var(--font);font-size:16px;outline:none;-webkit-appearance:none;transition:all .2s}
#sinp:focus{border-color:rgba(0,122,255,.6);box-shadow:0 0 0 3px rgba(0,122,255,.15)}
#sinp::placeholder{color:var(--t3)}
#sclr{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:none;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.22);border:none;cursor:pointer;color:var(--t1);font-size:12px;align-items:center;justify-content:center;-webkit-appearance:none}
#sclr.show{display:flex}
#chips{display:flex;gap:8px;padding:0 20px 10px;overflow-x:auto;flex-shrink:0}
.chip{padding:6px 15px;border-radius:var(--rf);border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:var(--t2);font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;-webkit-appearance:none;font-family:var(--font);transition:all .18s}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}.chip:active{transform:scale(.92)}
#sugg-wrap{display:none;flex-direction:column;padding:0 12px 4px;gap:1px;flex-shrink:0}
#sugg-wrap.show{display:flex}
.sg{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r2);cursor:pointer;transition:background .14s}
.sg:active{background:rgba(255,255,255,.06)}
.sg svg{width:15px;height:15px;color:var(--t3);flex-shrink:0}.sg span{font-size:15px}
.ti{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r2);cursor:pointer;transition:background .14s}
.ti:active{background:rgba(255,255,255,.06)}.ti.np .ttl{color:var(--acc)}
.ti-th{width:54px;height:54px;border-radius:10px;object-fit:cover;background:var(--t4);flex-shrink:0}
.ti-inf{flex:1;overflow:hidden}
.ttl{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.met{font-size:12px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{font-size:12px;color:var(--t3);flex-shrink:0}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:60px 32px;text-align:center}
.e-ico{font-size:52px;opacity:.5}.e-ttl{font-size:18px;font-weight:600;color:var(--t2)}.e-sub{font-size:14px;color:var(--t3);line-height:1.5;max-width:240px}
.ld{display:flex;align-items:center;justify-content:center;padding:48px;flex-direction:column;gap:14px}
.sp{width:28px;height:28px;border:2.5px solid rgba(255,255,255,.1);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sp-t{font-size:14px;color:var(--t3)}

/* QUEUE */
.qi{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--r2);cursor:pointer;transition:background .14s}
.qi:active{background:rgba(255,255,255,.06)}
.qn{width:24px;text-align:center;font-size:12px;color:var(--t3);flex-shrink:0}.qn.np{color:var(--acc);font-size:9px}

/* PLAYER */
#player{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;transform:translateY(100%);transition:transform .42s cubic-bezier(.32,.72,0,1)}
#player.open{display:flex;transform:translateY(0)}
#p-bg{position:absolute;inset:0;z-index:0;overflow:hidden}
#p-bgi{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(80px) brightness(.28) saturate(2.8);transform:scale(1.5);transition:background-image .9s ease}
#p-bgo{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.1) 0%,rgba(0,0,0,.05) 30%,rgba(0,0,0,.55) 72%,rgba(0,0,0,.94) 100%)}
#p-c{position:relative;z-index:1;display:flex;flex-direction:column;flex:1;padding:0 24px;padding-top:var(--st);padding-bottom:calc(var(--sb)+14px);overflow:hidden}
#p-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 0 16px}
.phb{width:36px;height:36px;border:none;background:rgba(255,255,255,.14);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:50%;cursor:pointer;color:var(--t1);display:flex;align-items:center;justify-content:center;-webkit-appearance:none;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.phb:active{transform:scale(.84)}
#p-lbl{font-size:11px;font-weight:700;color:var(--t2);letter-spacing:1.2px;text-transform:uppercase}
#art-w{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 0;min-height:0}
#art{width:min(100%,290px);aspect-ratio:1;border-radius:var(--r4);object-fit:cover;box-shadow:0 32px 80px rgba(0,0,0,.8);transition:transform .42s cubic-bezier(.34,1.56,.64,1),opacity .3s;background:var(--t4)}
#art.loading{transform:scale(.88);opacity:.45}#art.playing{transform:scale(1)}#art.paused{transform:scale(.91)}
#ti-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
#ti-inf{flex:1;overflow:hidden}
#p-ttl{font-size:21px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#p-ath{font-size:15px;color:var(--t2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lk{width:36px;height:36px;border:none;background:none;cursor:pointer;color:var(--t3);display:flex;align-items:center;justify-content:center;-webkit-appearance:none;flex-shrink:0;transition:transform .2s cubic-bezier(.34,1.56,.64,1),color .2s}
#lk.on{color:var(--red)}#lk:active{transform:scale(.76)}
#prog-w{padding:8px 0 2px}
#pbar{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.2);outline:none;cursor:pointer}
#pbar::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:transform .14s}
#pbar:active::-webkit-slider-thumb{transform:scale(1.35)}
#t-row{display:flex;justify-content:space-between;margin-top:5px}
.tl{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
#ctrls{display:flex;align-items:center;justify-content:space-between;padding:12px 0 6px}
.cb{width:48px;height:48px;border:none;background:none;cursor:pointer;color:var(--t1);display:flex;align-items:center;justify-content:center;border-radius:50%;-webkit-appearance:none;transition:transform .18s cubic-bezier(.34,1.56,.64,1),opacity .2s}
.cb:active{transform:scale(.8);opacity:.55}.cb.dim{color:var(--t3)}.cb.on{color:var(--acc)}
#pp{width:68px;height:68px;background:rgba(255,255,255,.95);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-appearance:none;box-shadow:0 12px 40px rgba(0,0,0,.45);transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
#pp:active{transform:scale(.87)}#pp svg{color:#000}
#v-row{display:flex;align-items:center;gap:10px;padding:6px 0 2px}
.vico{color:var(--t3);flex-shrink:0}
#vsl{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:rgba(255,255,255,.2);outline:none;cursor:pointer}
#vsl::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 1px 4px rgba(0,0,0,.3)}
#sk-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0 0}
.skb{border:none;background:none;cursor:pointer;color:var(--t3);display:flex;align-items:center;justify-content:center;-webkit-appearance:none;padding:8px;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.skb:active{transform:scale(.8)}
#spd{border:none;background:rgba(255,255,255,.1);border-radius:var(--rf);padding:5px 13px;color:var(--t2);font-size:13px;font-weight:600;cursor:pointer;-webkit-appearance:none;font-family:var(--font);transition:all .18s}
#spd:active{transform:scale(.9)}

/* TOAST */
#toast{position:fixed;bottom:calc(var(--nav)+12px);left:50%;transform:translateX(-50%) translateY(14px);background:rgba(18,18,18,.93);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:var(--rf);padding:9px 20px;font-size:13px;color:var(--t2);z-index:500;opacity:0;pointer-events:none;transition:all .25s;white-space:nowrap;max-width:calc(100vw - 48px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* REGION SHEET */
#rg{position:fixed;inset:0;z-index:600;display:none;align-items:flex-end}
#rg.show{display:flex}
#rg-bg{position:absolute;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#rg-card{position:relative;z-index:1;width:100%;background:#141414;border-radius:var(--r4) var(--r4) 0 0;padding-bottom:calc(var(--sb)+16px);max-height:72vh;overflow:hidden;display:flex;flex-direction:column}
.rg-hdl{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:12px auto 2px}
.rg-ttl{font-size:17px;font-weight:700;padding:10px 20px 14px}
#rg-lst{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 12px;display:flex;flex-direction:column;gap:2px}
.ro{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:var(--r2);cursor:pointer;transition:background .14s;font-size:15px}
.ro:active{background:rgba(255,255,255,.07)}.ro.sel{color:var(--acc);font-weight:600}
.ro-fl{font-size:22px;flex-shrink:0}

@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fu .3s cubic-bezier(.32,.72,0,1) forwards;opacity:0}
</style>
</head>
<body>
<div id="orbs"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>

<div id="app">
  <!-- HOME -->
  <div class="view active" id="home-view">
    <div class="scr" id="home-scr">
      <div class="hg">
        <div class="hg-sub" id="greet">Good evening</div>
        <div class="hg-ttl">What's the vibe?</div>
      </div>
      <button id="rgn-btn" onclick="openRgn()">
        <span id="rgn-f">🇧🇩</span><span id="rgn-n">Bangladesh</span>
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="sh"><div class="st">🔥 Trending</div></div>
      <div class="frow" id="feat-r"><div class="sk sk-fc"></div><div class="sk sk-fc"></div><div class="sk sk-fc"></div></div>
      <div class="sh"><div class="st">✨ Hot Right Now</div></div>
      <div class="grow" id="hot-r"><div class="sk sk-gc"></div><div class="sk sk-gc"></div><div class="sk sk-gc"></div><div class="sk sk-gc"></div></div>
      <div class="sh"><div class="st">🎭 Moods</div></div>
      <div class="grow" id="mood-r"></div>
      <div id="rec-sec" style="display:none">
        <div class="sh"><div class="st">🕐 Recently Played</div></div>
        <div id="rec-lst"></div>
      </div>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="view" id="search-view">
    <div class="v-hdr"><div class="v-ttl">Search</div></div>
    <div id="sbox">
      <input id="sinp" type="search" placeholder="Songs, artists, YouTube URLs…" autocomplete="off" autocorrect="off" spellcheck="false">
      <button id="sclr">✕</button>
    </div>
    <div id="chips">
      <button class="chip on" data-f="all">All</button>
      <button class="chip" data-f="song">Songs</button>
      <button class="chip" data-f="artist">Artists</button>

<script>
'use strict';

// ═══ API — all calls go to our own Vercel serverless functions ═══
const API = {
  search:      q => `/api/search?q=${encodeURIComponent(q.q)}&f=${q.f||'all'}`,
  stream:      id => `/api/stream?id=${encodeURIComponent(id)}`,
  trending:    r  => `/api/trending?region=${encodeURIComponent(r)}`,
  suggestions: q  => `/api/suggestions?q=${encodeURIComponent(q)}`,
};

const REGIONS=[
  {c:'BD',n:'Bangladesh',f:'🇧🇩'},{c:'IN',n:'India',f:'🇮🇳'},
  {c:'US',n:'United States',f:'🇺🇸'},{c:'GB',n:'UK',f:'🇬🇧'},
  {c:'PK',n:'Pakistan',f:'🇵🇰'},{c:'ID',n:'Indonesia',f:'🇮🇩'},
  {c:'TR',n:'Turkey',f:'🇹🇷'},{c:'EG',n:'Egypt',f:'🇪🇬'},
  {c:'SA',n:'Saudi Arabia',f:'🇸🇦'},{c:'NG',n:'Nigeria',f:'🇳🇬'},
  {c:'BR',n:'Brazil',f:'🇧🇷'},{c:'MX',n:'Mexico',f:'🇲🇽'},
  {c:'DE',n:'Germany',f:'🇩🇪'},{c:'FR',n:'France',f:'🇫🇷'},
  {c:'KR',n:'South Korea',f:'🇰🇷'},{c:'JP',n:'Japan',f:'🇯🇵'},
  {c:'PH',n:'Philippines',f:'🇵🇭'},{c:'VN',n:'Vietnam',f:'🇻🇳'},
  {c:'RU',n:'Russia',f:'🇷🇺'},{c:'TH',n:'Thailand',f:'🇹🇭'},
];
const MOODS=[
  {l:'Chill',e:'🌙',c:'#0a0a2a',q:'chill lofi music'},
  {l:'Workout',e:'💪',c:'#280808',q:'workout pump up music 2025'},
  {l:'Party',e:'🎉',c:'#180828',q:'party hits dance 2025'},
  {l:'Focus',e:'🎯',c:'#082818',q:'focus study concentration music'},
  {l:'Sad',e:'🌧️',c:'#0a1628',q:'sad emotional ballads'},
  {l:'Happy',e:'☀️',c:'#282408',q:'happy upbeat feel good songs 2025'},
  {l:'Desi',e:'🎸',c:'#1e0808',q:'bangla hindi desi hits 2025'},
  {l:'Sleep',e:'😴',c:'#080e28',q:'sleep relaxing ambient music'},
];

// ═══ STATE ═══
const S={
  id:null,track:null,playing:false,loop:false,shuffle:false,
  speeds:[.5,.75,1,1.25,1.5,1.75,2],si:2,
  queue:[],history:[],
  liked:new Set(JSON.parse(localStorage.getItem('ap_liked')||'[]')),
  region:localStorage.getItem('ap_region')||'BD',
  filter:'all',results:[],playerOpen:false,
  vol:parseFloat(localStorage.getItem('ap_vol')||'1'),
};

// Native <audio> element — the KEY to background play on iOS
const audio=new Audio();
audio.crossOrigin='anonymous';
audio.volume=S.vol;
audio.preload='auto';

// ═══ DOM ═══
const $=id=>document.getElementById(id), $$=s=>document.querySelectorAll(s);
const D={
  sinp:$('sinp'),sclr:$('sclr'),suggWrap:$('sugg-wrap'),results:$('results'),
  mini:$('mini'),mArt:$('m-art'),mTtl:$('m-ttl'),mAth:$('m-ath'),
  mIco:$('m-ico'),mFill:$('m-fill'),
  player:$('player'),pbgi:$('p-bgi'),art:$('art'),
  pttl:$('p-ttl'),path:$('p-ath'),pbar:$('pbar'),
  tc:$('tc'),tt:$('tt'),ppico:$('pp-ico'),lkico:$('lk-ico'),
  lk:$('lk'),toast:$('toast'),vsl:$('vsl'),spd:$('spd'),
  rgnF:$('rgn-f'),rgnN:$('rgn-n'),
};

// ═══ UTILS ═══
const fmt=s=>{if(!s||isNaN(s))return'0:00';s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=String(s%60).padStart(2,'0'),mm=h?String(m).padStart(2,'0'):m;return h?`${h}:${mm}:${ss}`:`${mm}:${ss}`};
const thumb=(id,q='hqdefault')=>`https://i.ytimg.com/vi/${id}/${q}.jpg`;
const ytId=u=>{if(!u)return null;const m=u.match(/(?:youtube\.com.*[?&]v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);return m?m[1]:null};
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const shuf=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b};

let toastT;
const toast=(m,d=2600)=>{D.toast.textContent=m;D.toast.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>D.toast.classList.remove('show'),d)};

// ═══ REGION ═══
const applyRgn=code=>{
  S.region=code;localStorage.setItem('ap_region',code);
  const r=REGIONS.find(x=>x.c===code)||REGIONS[0];
  D.rgnF.textContent=r.f;D.rgnN.textContent=r.n;
  loadHome();
};
window.openRgn=()=>{
  $('rg-lst').innerHTML=REGIONS.map(r=>`<div class="ro${r.c===S.region?' sel':''}" onclick="selRgn('${r.c}')"><span class="ro-fl">${r.f}</span>${r.n}</div>`).join('');
  $('rg').classList.add('show');
};
window.closeRgn=()=>$('rg').classList.remove('show');
window.selRgn=c=>{closeRgn();applyRgn(c)};
(()=>{const r=REGIONS.find(x=>x.c===S.region)||REGIONS[0];D.rgnF.textContent=r.f;D.rgnN.textContent=r.n;})();

// ═══ PLAY — the core: fetch stream URL server-side, play via native <audio> ═══
async function playTrack(id, info={}) {
  if(!id) return;
  if(S.id&&S.track) S.history.unshift({id:S.id,...S.track});
  if(S.history.length>60) S.history.pop();
  S.id=id; S.playing=false;

  const t=info.title||'Loading…', a=info.author||'';
  setMini({t,a,id}); setPlayerInfo({t,a}); setArt(id);
  if(!S.playerOpen) openPlayer();
  toast('⏳ Loading…');
  D.art.className='loading';

  try {
    // Fetch stream URL from our serverless function — no CORS, runs server-side
    const res = await fetch(API.stream(id), { signal: AbortSignal.timeout(15000) });
    if(!res.ok) throw new Error(`Stream API ${res.status}`);
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    if(!data.audioUrl) throw new Error('No audio URL returned');

    const title = data.title || t;
    const author = (data.author || a).replace(' - Topic','');
    const dur = data.duration || 0;

    S.track = { title, author, duration: dur, id };
    setMini({t:title, a:author, id});
    setPlayerInfo({t:title, a:author, dur});
    setArt(id);
    setMS(title, author, id, dur);
    document.title = `${title} — Applify`;
    savePH(id, title, author);

    // Play via native <audio> — this is what enables iOS background play
    audio.src = data.audioUrl;
    audio.playbackRate = S.speeds[S.si];
    audio.load();
    await audio.play().catch(()=>{});

  } catch(e) {
    toast('⚠ '+e.message, 4000);
    D.art.className=''; updateIcons();
  }
}

function setArt(id){
  const u=thumb(id);
  D.art.src=u; D.mArt.src=u; D.pbgi.style.backgroundImage=`url(${u})`;
  const o=document.querySelector('.o1');
  o.style.background=`url(${thumb(id,'mqdefault')}) center/cover`;
  o.style.filter='blur(90px) saturate(4) brightness(.45)';
  o.style.opacity='.7';
}
function setMini({t,a}){D.mTtl.textContent=t;D.mAth.textContent=a||'—';D.mini.classList.add('show')}
function setPlayerInfo({t,a,dur}){
  D.pttl.textContent=t||'—';D.path.textContent=a||'—';
  if(dur){D.pbar.max=dur;D.tt.textContent=fmt(dur);}
  const lk=S.liked.has(S.id);
  D.lk.classList.toggle('on',lk);D.lkico.setAttribute('fill',lk?'currentColor':'none');
}
const playPath='<path d="M8 5v14l11-7z"/>';
const pausePath='<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
function updateIcons(){
  D.ppico.innerHTML=S.playing?pausePath:playPath;
  D.mIco.innerHTML=S.playing?pausePath:playPath;
  D.art.className=S.id?(S.playing?'playing':'paused'):'';
}

// ═══ CONTROLS ═══
window.togglePlay=()=>{if(!S.id)return;S.playing?audio.pause():audio.play().catch(()=>{})};
window.seekBy=d=>{audio.currentTime=Math.max(0,Math.min(audio.currentTime+d,audio.duration||0))};
window.skipNext=()=>{if(!S.queue.length)return;const n=S.queue.shift();renderQ();playTrack(n.id,n)};
window.skipPrev=()=>{
  if(audio.currentTime>3){audio.currentTime=0;return;}
  if(!S.history.length)return;
  const p=S.history.shift();
  if(S.id&&S.track)S.queue.unshift({id:S.id,...S.track});
  playTrack(p.id,p);renderQ();
};
window.toggleLoop=()=>{S.loop=!S.loop;audio.loop=S.loop;$('loopbtn').classList.toggle('on',S.loop);toast(S.loop?'🔁 Loop on':'Loop off')};
window.toggleShuffle=()=>{S.shuffle=!S.shuffle;$('shuf').classList.toggle('on',S.shuffle);if(S.shuffle&&S.queue.length>1)S.queue=shuf(S.queue);renderQ();toast(S.shuffle?'🔀 Shuffle on':'Shuffle off')};
window.toggleLike=()=>{
  if(!S.id)return;
  if(S.liked.has(S.id)){S.liked.delete(S.id);toast('Removed from likes');}
  else{S.liked.add(S.id);toast('❤ Added to likes');}
  localStorage.setItem('ap_liked',JSON.stringify([...S.liked]));
  const lk=S.liked.has(S.id);D.lk.classList.toggle('on',lk);D.lkico.setAttribute('fill',lk?'currentColor':'none');
};
window.cycleSpd=()=>{S.si=(S.si+1)%S.speeds.length;const s=S.speeds[S.si];audio.playbackRate=s;D.spd.textContent=s+'×';toast(s+'× speed')};

// Player open/close
window.openPlayer=()=>{if(!S.id)return;S.playerOpen=true;D.player.style.display='flex';requestAnimationFrame(()=>D.player.classList.add('open'))};
window.closePlayer=()=>{S.playerOpen=false;D.player.classList.remove('open');setTimeout(()=>{if(!S.playerOpen)D.player.style.display='none'},440)};
let ty=0,tt_=0;
D.player.addEventListener('touchstart',e=>{ty=e.touches[0].clientY;tt_=Date.now()},{passive:true});
D.player.addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-ty>90&&Date.now()-tt_<380)closePlayer()},{passive:true});

// ═══ TABS ═══
window.tab=v=>{
  $$('.view').forEach(x=>x.classList.remove('active'));
  $$('.nb').forEach(x=>x.classList.remove('on'));
  $(`${v}-view`).classList.add('active');
  $(`nb-${v}`)?.classList.add('on');
  if(v==='queue') renderQ();
  if(v==='home'){updateGreet();renderRecent();}
};

// ═══ QUEUE ═══
function renderQ(){
  const el=$('q-lst');
  if(!S.queue.length&&!S.id){el.innerHTML='<div class="empty"><div class="e-ico">🎶</div><div class="e-ttl">Queue is empty</div><div class="e-sub">Search and play music to fill it</div></div>';return;}
  let h='';
  if(S.id&&S.track){
    h+=`<div style="padding:8px 12px 4px;font-size:10px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.8px">Now Playing</div>
    <div class="qi"><div class="qn np">▶</div><img class="ti-th" src="${thumb(S.id)}" style="width:44px;height:44px" alt=""><div class="ti-inf"><div class="ttl" style="color:var(--acc)">${esc(S.track.title)}</div><div class="met">${esc(S.track.author)}</div></div></div>`;
  }
  if(S.queue.length){
    h+=`<div style="padding:12px 12px 4px;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.8px">Up Next</div>`;
    S.queue.forEach((t,i)=>{h+=`<div class="qi" onclick="playFromQ(${i})"><div class="qn">${i+1}</div><img class="ti-th" src="${thumb(t.id)}" style="width:44px;height:44px" alt=""><div class="ti-inf"><div class="ttl">${esc(t.title)}</div><div class="met">${esc(t.author)}</div></div></div>`;});
  }
  el.innerHTML=h;
}
window.playFromQ=i=>{const t=S.queue.splice(i,1)[0];if(t)playTrack(t.id,t);renderQ()};

// ═══ AUDIO EVENTS ═══
audio.addEventListener('playing',()=>{S.playing=true;updateIcons();D.toast.classList.remove('show')});
audio.addEventListener('pause',()=>{S.playing=false;updateIcons()});
audio.addEventListener('ended',()=>{if(!S.loop)skipNext()});
audio.addEventListener('timeupdate',()=>{
  if(document.activeElement===D.pbar)return;
  const ct=audio.currentTime,dur=audio.duration||0;
  D.pbar.value=ct;D.tc.textContent=fmt(ct);
  D.mFill.style.width=(dur?(ct/dur)*100:0)+'%';
});
audio.addEventListener('loadedmetadata',()=>{if(audio.duration&&isFinite(audio.duration)){D.pbar.max=audio.duration;D.tt.textContent=fmt(audio.duration)}});
audio.addEventListener('waiting',()=>toast('⏳ Buffering…',8000));
audio.addEventListener('error',()=>{
  if(!S.id)return;
  toast('⚠ Stream error — retrying…');
  setTimeout(()=>playTrack(S.id,S.track),1200);
});
D.pbar.addEventListener('input',()=>{audio.currentTime=parseFloat(D.pbar.value);D.tc.textContent=fmt(D.pbar.value)});
D.vsl.value=S.vol;
D.vsl.addEventListener('input',()=>{const v=parseFloat(D.vsl.value);audio.volume=v;S.vol=v;localStorage.setItem('ap_vol',v)});

// ═══ MEDIA SESSION — lock screen controls ═══
function setMS(title,author,id,dur){
  if(!('mediaSession'in navigator))return;
  const ms=navigator.mediaSession;
  ms.metadata=new MediaMetadata({title,artist:author,artwork:[
    {src:thumb(id,'mqdefault'),sizes:'320x180'},{src:thumb(id,'hqdefault'),sizes:'480x360'},
    {src:thumb(id,'maxresdefault'),sizes:'1280x720'},
  ]});
  ms.setActionHandler('play',()=>audio.play());
  ms.setActionHandler('pause',()=>audio.pause());
  ms.setActionHandler('nexttrack',skipNext);
  ms.setActionHandler('previoustrack',skipPrev);
  ms.setActionHandler('seekbackward',d=>seekBy(-(d.seekOffset||15)));
  ms.setActionHandler('seekforward',d=>seekBy(d.seekOffset||15));
  try{ms.setActionHandler('seekto',d=>{if(d.seekTime!=null)audio.currentTime=d.seekTime})}catch{}
}
audio.addEventListener('timeupdate',()=>{
  const ms=navigator.mediaSession;
  if(!ms||!audio.duration||!isFinite(audio.duration))return;
  try{ms.setPositionState({duration:audio.duration,playbackRate:audio.playbackRate,position:audio.currentTime})}catch{}
},{passive:true});

// ═══ SEARCH ═══
let sAC, sugT;
D.sinp.addEventListener('input',()=>{
  const q=D.sinp.value.trim();
  D.sclr.classList.toggle('show',q.length>0);
  if(ytId(q)){hideSugg();toast('YouTube URL — press Enter to play');return;}
  clearTimeout(sugT);
  if(q.length>1) sugT=setTimeout(()=>loadSugg(q),320); else hideSugg();
});
D.sinp.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;e.preventDefault();
  const q=D.sinp.value.trim(),id=ytId(q);
  if(id){playTrack(id,{title:'YouTube Video',author:''});D.sinp.blur();}
  else if(q){runSearch(q,S.filter);hideSugg();D.sinp.blur();}
});
D.sclr.addEventListener('click',()=>{
  D.sinp.value='';D.sclr.classList.remove('show');hideSugg();
  D.results.innerHTML='<div class="empty"><div class="e-ico">🎵</div><div class="e-ttl">Applify</div><div class="e-sub">Search or paste a YouTube URL</div></div>';
  D.sinp.focus();
});
$$('.chip').forEach(c=>c.addEventListener('click',()=>{
  $$('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');
  S.filter=c.dataset.f;
  const q=D.sinp.value.trim();if(q&&!ytId(q))runSearch(q,S.filter);
}));

async function loadSugg(q){
  try{
    const r=await fetch(API.suggestions(q),{signal:AbortSignal.timeout(4000)});
    const items=await r.json();
    if(!Array.isArray(items)||!items.length){hideSugg();return;}
    D.suggWrap.innerHTML=items.slice(0,6).map(s=>`<div class="sg" onclick="pickSugg('${esc(s)}')"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><span>${esc(s)}</span></div>`).join('');
    D.suggWrap.classList.add('show');
  }catch{hideSugg();}
}
function hideSugg(){D.suggWrap.classList.remove('show');D.suggWrap.innerHTML='';}
window.pickSugg=t=>{D.sinp.value=t;D.sclr.classList.add('show');hideSugg();runSearch(t,S.filter);D.sinp.blur()};

async function runSearch(q,f){
  if(sAC)sAC.abort();sAC=new AbortController();
  D.results.innerHTML='<div class="ld"><div class="sp"></div><div class="sp-t">Searching…</div></div>';
  try{
    const r=await fetch(API.search({q,f}),{signal:AbortSignal.timeout(15000)});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const items=await r.json();
    if(!items?.length){D.results.innerHTML='<div class="empty"><div class="e-ico">🔍</div><div class="e-ttl">No results</div><div class="e-sub">Try different keywords</div></div>';return;}
    S.results=items;
    D.results.innerHTML=items.map((item,i)=>{
      const id=item.id||item.videoId;if(!id)return'';
      const t=item.title||'Unknown',a=(item.author||'').replace(' - Topic','');
      return `<div class="ti fu ${id===S.id?'np':''}" style="animation-delay:${i*.04}s" onclick="playItem(${i})">
        <img class="ti-th" src="${thumb(id)}" alt="" loading="lazy" onerror="this.style.opacity='.2'">
        <div class="ti-inf"><div class="ttl">${esc(t)}</div><div class="met">${esc(a)}</div></div>
        ${item.duration?`<div class="dur">${esc(item.duration)}</div>`:''}
      </div>`;
    }).join('');
  }catch(e){
    if(e.name==='AbortError')return;
    D.results.innerHTML=`<div class="empty"><div class="e-ico">⚠️</div><div class="e-ttl">Search failed</div><div class="e-sub">${esc(e.message)}</div></div>`;
  }
}
window.playItem=i=>{
  const item=S.results[i];if(!item)return;
  const id=item.id||item.videoId;if(!id)return;
  const t=item.title||'Unknown',a=(item.author||'').replace(' - Topic','');
  const rest=S.results.slice(i+1).filter(x=>x.id||x.videoId).map(x=>({
    id:x.id||x.videoId,title:x.title||'Unknown',author:(x.author||'').replace(' - Topic','')
  }));
  S.queue=S.shuffle?shuf(rest):rest;
  playTrack(id,{title:t,author:a});
};

// ═══ HOME ═══
function updateGreet(){
  const h=new Date().getHours();
  $('greet').textContent=h<5?'🌙 Late night':h<12?'Good morning':h<17?'Good afternoon':h<21?'Good evening':'🌙 Good night';
}
function savePH(id,title,author){
  let h=JSON.parse(localStorage.getItem('ap_ph')||'[]');
  h=h.filter(i=>i.id!==id);h.unshift({id,title,author,ts:Date.now()});
  localStorage.setItem('ap_ph',JSON.stringify(h.slice(0,30)));
}
function renderRecent(){
  const h=JSON.parse(localStorage.getItem('ap_ph')||'[]');
  const sec=$('rec-sec'),lst=$('rec-lst');
  if(!h.length){sec.style.display='none';return;}
  sec.style.display='block';
  lst.innerHTML=h.slice(0,8).map(i=>`<div class="ri" onclick="playTrack('${esc(i.id)}',{title:${JSON.stringify(i.title)},author:${JSON.stringify(i.author)}})">
    <img class="ri-img" src="${thumb(i.id)}" alt="" loading="lazy">
    <div class="ri-inf"><div class="ri-ttl">${esc(i.title)}</div><div class="ri-sub">${esc(i.author)}</div></div>
    <button class="ri-pb"><svg width="13" height="13" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
  </div>`).join('');
}

const BDGS=['🔥 Trending','⭐ Popular','✨ Fresh','📈 Viral','🎤 Featured','🎵 Hot'];
async function loadHome(){
  updateGreet();renderRecent();
  $('mood-r').innerHTML=MOODS.map(m=>`<div class="mc" onclick="searchMood('${esc(m.q)}','${esc(m.l)}')">
    <div class="mc-bg" style="background:${m.c}">${m.e}</div><div class="mc-lbl">${m.l}</div>
  </div>`).join('');

  $('feat-r').innerHTML='<div class="sk sk-fc"></div><div class="sk sk-fc"></div><div class="sk sk-fc"></div>';
  $('hot-r').innerHTML='<div class="sk sk-gc"></div><div class="sk sk-gc"></div><div class="sk sk-gc"></div><div class="sk sk-gc"></div>';

  try{
    const r=await fetch(API.trending(S.region),{signal:AbortSignal.timeout(20000)});
    if(!r.ok) throw new Error('Trending failed');
    const items=await r.json();
    if(!items?.length) throw new Error('empty');

    $('feat-r').innerHTML=items.slice(0,5).map((item,i)=>{
      const id=item.id||item.videoId;if(!id)return'';
      return `<div class="fc" onclick="playTrack('${esc(id)}',{title:${JSON.stringify(item.title||'')},author:${JSON.stringify((item.author||'').replace(' - Topic',''))}})">
        <img src="${thumb(id,'hqdefault')}" alt="" loading="lazy" onerror="this.style.opacity='.3'">
        <div class="fc-bdg">${BDGS[i%BDGS.length]}</div>
        <div class="fc-ov"><div class="fc-ttl">${esc(item.title||'')}</div><div class="fc-ath">${esc((item.author||'').replace(' - Topic',''))}</div></div>
      </div>`;
    }).join('');

    $('hot-r').innerHTML=items.slice(5,13).map(item=>{
      const id=item.id||item.videoId;if(!id)return'';
      return `<div class="gc" onclick="playTrack('${esc(id)}',{title:${JSON.stringify(item.title||'')},author:${JSON.stringify((item.author||'').replace(' - Topic',''))}})">
        <img class="gc-img" src="${thumb(id)}" alt="" loading="lazy" onerror="this.style.opacity='.3'">
        <div class="gc-ttl">${esc(item.title||'')}</div>
        <div class="gc-sub">${esc((item.author||'').replace(' - Topic',''))}</div>
      </div>`;
    }).join('');
  }catch{
    $('feat-r').innerHTML='<div style="padding:20px;color:var(--t3);font-size:14px">Couldn\'t load trending. Pull to retry.</div>';
    $('hot-r').innerHTML='';
  }
}
window.searchMood=(q,l)=>{tab('search');D.sinp.value=l;D.sclr.classList.add('show');runSearch(q,'all')};

// ═══ TOUCH / KEYBOARD ═══
document.addEventListener('touchmove',e=>{
  if(e.target.closest('.scr,.frow,.grow,#pbar,#vsl'))return;
  e.preventDefault();
},{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  if(e.code==='ArrowLeft')seekBy(-15);
  if(e.code==='ArrowRight')seekBy(15);
  if(e.code==='Escape')closePlayer();
});

// ═══ SERVICE WORKER ═══
if('serviceWorker'in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
  setInterval(()=>navigator.serviceWorker.ready.then(r=>r.active?.postMessage('ping')).catch(()=>{}),20000);
}

// ═══ iOS hint ═══
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone)
  setTimeout(()=>toast('📲 Tap Share → Add to Home Screen for background play',5000),4000);

// ═══ URL params ═══
(()=>{const p=new URLSearchParams(location.search),id=p.get('v')||ytId(p.get('url')||'');if(id)setTimeout(()=>playTrack(id,{title:'Loading…',author:''}),600)})();

loadHome();
</script>
