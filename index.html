<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Applify">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.json">
<title>Applify</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
:root{
  --safe-top:env(safe-area-inset-top,44px);
  --safe-bottom:env(safe-area-inset-bottom,34px);
  --accent:#007AFF;--danger:#FF3B30;--success:#34C759;
  --t1:rgba(255,255,255,0.95);--t2:rgba(255,255,255,0.55);--t3:rgba(255,255,255,0.3);
  --g1:rgba(255,255,255,0.09);--g2:rgba(255,255,255,0.16);--gb:rgba(255,255,255,0.06);
  --r-sm:10px;--r-md:16px;--r-lg:22px;--r-xl:28px;--r-f:999px;
  --nav:82px;--font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;overscroll-behavior:none}
body{font-family:var(--font);background:#000;color:var(--t1);height:100%;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}

/* BG ORBS */
#orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0;transition:background 1.5s,opacity 1.5s;will-change:transform}
.orb1{width:400px;height:400px;top:-100px;right:-100px;animation:of1 15s ease-in-out infinite}
.orb2{width:300px;height:300px;bottom:80px;left:-80px;background:rgba(88,86,214,.5);animation:of2 12s ease-in-out infinite;opacity:.3}
.orb3{width:220px;height:220px;top:45%;left:25%;background:rgba(0,122,255,.4);animation:of3 18s ease-in-out infinite;opacity:.25}
@keyframes of1{0%,100%{transform:translate(0,0) scale(1)}40%{transform:translate(25px,-20px) scale(1.1)}70%{transform:translate(-15px,18px) scale(.93)}}
@keyframes of2{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-25px)}}
@keyframes of3{0%,100%{transform:translate(0,0)}33%{transform:translate(-20px,15px)}66%{transform:translate(18px,-12px)}}

/* APP SHELL */
#app{position:fixed;inset:0;display:flex;flex-direction:column;z-index:1}
.view{display:none;flex-direction:column;flex:1;overflow:hidden;padding-top:var(--safe-top)}
.view.active{display:flex}

/* GLASS */
.glass{background:var(--g1);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--g2);border-radius:var(--r-lg)}

/* NAVBAR */
#nav{position:relative;z-index:100;display:flex;align-items:center;justify-content:space-around;height:var(--nav);padding-bottom:var(--safe-bottom);background:rgba(0,0,0,.65);backdrop-filter:blur(32px) saturate(200%);-webkit-backdrop-filter:blur(32px) saturate(200%);border-top:1px solid rgba(255,255,255,.1);flex-shrink:0}
.nb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 18px;border:none;background:none;color:var(--t3);cursor:pointer;-webkit-appearance:none;transition:color .2s,transform .2s cubic-bezier(.34,1.56,.64,1)}
.nb.on{color:var(--accent)}
.nb:active{transform:scale(.88)}
.nb svg{width:23px;height:23px}
.nb span{font-size:10px;font-weight:500}

/* MINI PLAYER */
#mini{display:none;margin:8px 12px 0;flex-shrink:0;position:relative;z-index:50;border-radius:var(--r-lg);overflow:hidden;cursor:pointer}
#mini.show{display:block}
#mini-inner{display:flex;align-items:center;gap:12px;padding:10px 12px;background:rgba(255,255,255,.11);backdrop-filter:blur(30px) saturate(200%);-webkit-backdrop-filter:blur(30px) saturate(200%);border:1px solid rgba(255,255,255,.18);border-radius:var(--r-lg)}
#mini-art{width:42px;height:42px;border-radius:9px;object-fit:cover;background:var(--gb);flex-shrink:0}
#mini-info{flex:1;overflow:hidden}
#mini-ttl{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini-ath{font-size:11px;color:var(--t2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini-ctrls{display:flex;gap:6px;align-items:center;flex-shrink:0}
.mib{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;color:var(--t1);display:flex;align-items:center;justify-content:center;-webkit-appearance:none;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.mib:active{transform:scale(.85)}
#mini-prog{position:absolute;bottom:0;left:0;right:0;height:2px;background:rgba(255,255,255,.12);border-radius:0 0 var(--r-lg) var(--r-lg)}
#mini-fill{height:100%;background:var(--accent);width:0%;transition:width .8s linear;border-radius:inherit}

/* SCROLLABLE */
.scr{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1}

/* HEADERS */
.vh{padding:14px 20px 10px;flex-shrink:0}
.vtitle{font-size:30px;font-weight:800;letter-spacing:-.5px}

/* SEARCH VIEW */
#search-box{position:relative;margin:0 20px 10px}
#sinput{width:100%;padding:12px 44px 12px 16px;border-radius:var(--r-f);border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.1);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--t1);font-family:var(--font);font-size:16px;outline:none;-webkit-appearance:none;transition:all .2s}
#sinput:focus{border-color:rgba(0,122,255,.6);box-shadow:0 0 0 3px rgba(0,122,255,.15)}
#sinput::placeholder{color:var(--t3)}
#sclr{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:none;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.22);border:none;cursor:pointer;color:var(--t1);font-size:13px;align-items:center;justify-content:center;-webkit-appearance:none}
#sclr.show{display:flex}
#filters{display:flex;gap:8px;padding:0 20px 10px;overflow-x:auto;flex-shrink:0}
.chip{padding:6px 15px;border-radius:var(--r-f);border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:var(--t2);font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;-webkit-appearance:none;transition:all .2s}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:active{transform:scale(.93)}
#suggs{display:none;flex-direction:column;padding:0 12px 4px;gap:1px;flex-shrink:0}
#suggs.show{display:flex}
.sg{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-md);cursor:pointer;transition:background .15s}
.sg:active{background:rgba(255,255,255,.06)}
.sg svg{width:15px;height:15px;color:var(--t3);flex-shrink:0}
.sg span{font-size:15px}

/* TRACK ITEM */
.ti{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-md);cursor:pointer;transition:background .15s}
.ti:active{background:rgba(255,255,255,.06)}
.ti.now .ttl{color:var(--accent)}
.tthumb{width:54px;height:54px;border-radius:10px;object-fit:cover;background:var(--gb);flex-shrink:0}
.tinfo{flex:1;overflow:hidden}
.ttl{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmeta{font-size:12px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdur{font-size:12px;color:var(--t3);flex-shrink:0}

/* EMPTY / LOADING */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:60px 32px;text-align:center}
.ei{font-size:52px;opacity:.5}
.et{font-size:18px;font-weight:600;color:var(--t2)}
.es{font-size:14px;color:var(--t3);line-height:1.5;max-width:240px}
.spin-wrap{display:flex;align-items:center;justify-content:center;padding:48px;flex-direction:column;gap:14px}
.spin{width:30px;height:30px;border:2.5px solid rgba(255,255,255,.12);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.spin-txt{font-size:14px;color:var(--t3)}

/* HOME VIEW */
.hs{padding:2px 20px 6px}
.hs-sub{font-size:12px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px}
.hs-ttl{font-size:30px;font-weight:800;letter-spacing:-.5px}
.sh{display:flex;align-items:baseline;justify-content:space-between;padding:18px 20px 10px}
.st{font-size:19px;font-weight:700;letter-spacing:-.3px}
/* region picker */
#region-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--r-f);border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:var(--t2);font-size:13px;font-weight:500;cursor:pointer;-webkit-appearance:none;margin:0 20px 14px;transition:all .2s}
#region-pill:active{transform:scale(.94)}
/* featured cards */
.fscr{display:flex;gap:14px;padding:0 20px 2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.fc{flex-shrink:0;width:240px;height:150px;border-radius:var(--r-lg);overflow:hidden;position:relative;cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.fc:active{transform:scale(.95)}
.fc img{width:100%;height:100%;object-fit:cover}
.fco{position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.75) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:12px}
.fcttl{font-size:14px;font-weight:700;line-height:1.25;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.fcath{font-size:11px;color:rgba(255,255,255,.7);margin-top:2px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.fcbdg{position:absolute;top:9px;right:9px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);border-radius:var(--r-f);padding:3px 8px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
/* grid cards */
.gscr{display:flex;gap:12px;padding:0 20px 2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.gc{flex-shrink:0;width:128px;cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.gc:active{transform:scale(.93)}
.gcimg{width:128px;height:128px;border-radius:var(--r-md);object-fit:cover;background:var(--gb);display:block}
.gcttl{font-size:13px;font-weight:600;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcmeta{font-size:11px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* mood cards */
.mood{flex-shrink:0;width:128px;cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.mood:active{transform:scale(.93)}
.mood-img{width:128px;height:128px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-size:50px;flex-shrink:0}
.mood-lbl{font-size:13px;font-weight:600;margin-top:7px;text-align:center}
/* recent */
.ri{display:flex;align-items:center;gap:12px;padding:9px 20px;cursor:pointer;transition:background .15s}
.ri:active{background:rgba(255,255,255,.06)}
.rimg{width:46px;height:46px;border-radius:9px;object-fit:cover;background:var(--gb);flex-shrink:0}
.rinfo{flex:1;overflow:hidden}
.rttl{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmet{font-size:12px;color:var(--t2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rpb{width:32px;height:32px;border-radius:50%;border:none;background:rgba(255,255,255,.1);color:var(--t1);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;-webkit-appearance:none;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.rpb:active{transform:scale(.82)}
/* skeleton */
.skel{background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.05) 75%);background-size:200% 100%;animation:shim 1.5s infinite;border-radius:8px}
.sk-fc{width:240px;height:150px;border-radius:var(--r-lg);flex-shrink:0}
.sk-gc{width:128px;height:128px;border-radius:var(--r-md);flex-shrink:0}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* QUEUE VIEW */
.qi{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--r-md);cursor:pointer;transition:background .15s}
.qi:active{background:rgba(255,255,255,.06)}
.qnum{width:24px;text-align:center;font-size:12px;color:var(--t3);flex-shrink:0}
.qnum.np{color:var(--accent);font-size:9px}

/* PLAYER VIEW */
#player{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;transform:translateY(100%);transition:transform .45s cubic-bezier(.32,.72,0,1)}
#player.open{display:flex;transform:translateY(0)}
#pbg{position:absolute;inset:0;z-index:0;overflow:hidden}
#pbgi{position:absolute;inset:-50px;background-size:cover;background-position:center;filter:blur(70px) brightness(.3) saturate(2.5);transform:scale(1.4);transition:background-image .9s}
#pbgo{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.15) 0%,rgba(0,0,0,.05) 35%,rgba(0,0,0,.6) 75%,rgba(0,0,0,.92) 100%)}
#pc{position:relative;z-index:1;display:flex;flex-direction:column;flex:1;padding:0 24px;padding-top:var(--safe-top);padding-bottom:calc(var(--safe-bottom) + 16px);overflow:hidden}
/* player header */
#ph{display:flex;align-items:center;justify-content:space-between;padding:12px 0 18px}
.phb{width:36px;height:36px;border:none;background:rgba(255,255,255,.13);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:50%;cursor:pointer;color:var(--t1);display:flex;align-items:center;justify-content:center;-webkit-appearance:none;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.phb:active{transform:scale(.86)}
#ph-lbl{font-size:11px;font-weight:700;color:var(--t2);letter-spacing:1px;text-transform:uppercase}
/* artwork */
#art-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 0;min-height:0}
#art{width:min(100%,300px);aspect-ratio:1;border-radius:var(--r-xl);object-fit:cover;box-shadow:0 28px 80px rgba(0,0,0,.75);transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .3s;background:var(--gb)}
#art.loading{transform:scale(.9);opacity:.5}
#art.playing{transform:scale(1)}
#art.paused{transform:scale(.92)}
/* track info */
#tinfo-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
#tinfo{flex:1;overflow:hidden}
#pttl{font-size:21px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#path{font-size:15px;color:var(--t2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#likebtn{width:36px;height:36px;border:none;background:none;cursor:pointer;color:var(--t3);display:flex;align-items:center;justify-content:center;-webkit-appearance:none;flex-shrink:0;transition:transform .2s cubic-bezier(.34,1.56,.64,1),color .2s}
#likebtn.on{color:var(--danger)}
#likebtn:active{transform:scale(.78)}
/* progress */
#prog-wrap{padding:8px 0 2px}
#pbar{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.18);outline:none;cursor:pointer}
#pbar::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:transform .15s}
#pbar:active::-webkit-slider-thumb{transform:scale(1.35)}
#trow{display:flex;justify-content:space-between;margin-top:5px}
.tlbl{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
/* controls */
#ctrls{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px}
.cb{width:48px;height:48px;border:none;background:none;cursor:pointer;color:var(--t1);display:flex;align-items:center;justify-content:center;border-radius:50%;-webkit-appearance:none;transition:transform .18s cubic-bezier(.34,1.56,.64,1),opacity .2s}
.cb:active{transform:scale(.82);opacity:.6}
.cb.dim{color:var(--t3)}
.cb.on{color:var(--accent)}
#ppbtn{width:68px;height:68px;background:rgba(255,255,255,.95);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-appearance:none;box-shadow:0 10px 35px rgba(0,0,0,.4);transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
#ppbtn:active{transform:scale(.88)}
#ppbtn svg{color:#000}
/* vol row */
#vrow{display:flex;align-items:center;gap:10px;padding:8px 0 2px}
.vicon{color:var(--t3);flex-shrink:0}
#vslider{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:rgba(255,255,255,.18);outline:none;cursor:pointer}
#vslider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 1px 4px rgba(0,0,0,.3)}
/* seek btns */
#srow{display:flex;align-items:center;justify-content:space-between;padding:4px 0 0}
.sk-btn{border:none;background:none;cursor:pointer;color:var(--t3);display:flex;align-items:center;justify-content:center;-webkit-appearance:none;padding:8px;transition:transform .18s cubic-bezier(.34,1.56,.64,1),color .2s}
.sk-btn:active{transform:scale(.82)}
#spd-btn{border:none;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:var(--r-f);padding:5px 12px;color:var(--t2);font-size:13px;font-weight:600;cursor:pointer;-webkit-appearance:none;transition:all .2s}
#spd-btn:active{transform:scale(.92)}

/* TOAST */
#toast{position:fixed;bottom:calc(var(--nav) + 10px);left:50%;transform:translateX(-50%) translateY(16px);background:rgba(20,20,20,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:var(--r-f);padding:9px 20px;font-size:13px;color:var(--t2);z-index:500;opacity:0;pointer-events:none;transition:all .28s;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* REGION SHEET */
#region-sheet{position:fixed;inset:0;z-index:600;display:none;align-items:flex-end}
#region-sheet.show{display:flex}
#rs-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#rs-card{position:relative;z-index:1;width:100%;background:#111;border-radius:var(--r-xl) var(--r-xl) 0 0;padding-bottom:calc(var(--safe-bottom) + 16px);max-height:70vh;overflow:hidden;display:flex;flex-direction:column}
#rs-handle{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:12px auto 4px}
#rs-title{font-size:17px;font-weight:700;padding:10px 20px 14px}
#rs-list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 12px;display:flex;flex-direction:column;gap:2px}
.ropt{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:var(--r-md);cursor:pointer;transition:background .15s;font-size:15px}
.ropt:active{background:rgba(255,255,255,.07)}
.ropt.sel{color:var(--accent);font-weight:600}
.rflag{font-size:22px;flex-shrink:0}

/* FADE UP */
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fu .32s cubic-bezier(.32,.72,0,1) forwards;opacity:0}
</style>
</head>
<body>
<div id="orbs"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>

<div id="app">

  <!-- HOME VIEW -->
  <div class="view active" id="home-view">
    <div class="scr" id="home-scr">
      <div class="hs">
        <div class="hs-sub" id="greet-sub">Good evening</div>
        <div class="hs-ttl">What's the vibe?</div>
      </div>

      <button id="region-pill" onclick="openRegionSheet()">
        <span id="region-flag">🌍</span>
        <span id="region-name">Global</span>
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </button>

      <div class="sh"><div class="st">🔥 Trending</div></div>
      <div class="fscr" id="feat-row">
        <div class="skel sk-fc"></div><div class="skel sk-fc"></div><div class="skel sk-fc"></div>
      </div>

      <div class="sh"><div class="st">✨ Hot Right Now</div></div>
      <div class="gscr" id="hot-row">

// ═══ UTILS ═══
const fmt=s=>{if(!s||isNaN(s))return'0:00';s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=String(s%60).padStart(2,'0'),mm=h?String(m).padStart(2,'0'):m;return h?`${h}:${mm}:${ss}`:`${mm}:${ss}`};

const ytId=u=>{if(!u)return null;const m=u.match(/(?:youtube\.com.*[?&]v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);return m?m[1]:null};
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

// ═══ API — same domain ═══
async function apiFetch(path, params={}, timeout=10000){
  const u=new URL('/api/'+path, location.origin);
  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  const res=await fetch(u.toString(),{signal:AbortSignal.timeout(timeout)});
  if(!res.ok) throw new Error(`API ${res.status}`);
  return res.json();
}

async function pipedSearch(q, filter='music_songs'){
  for(const api of PIPED_APIS){
    try{
      const url=`${api}/search?q=${encodeURIComponent(q)}&filter=${filter}`;
      const res=await fetch(url,{signal:AbortSignal.timeout(8000)});
      if(!res.ok) continue;
      const data=await res.json();
      if(!data.items?.length) continue;
      return data.items.filter(i=>i.type==='stream'||i.type==='video').map(i=>({
        id: i.url?.split('v=')[1]||i.url?.split('/').pop()||'',
        title: i.title||'',
        author: i.uploaderName||'',
        duration: fmt(i.duration),
        type:'video'
      })).filter(i=>i.id);
    }catch{}
  }
  return [];
}

async function pipedTrending(region='BD'){
  for(const api of PIPED_APIS){
    try{
      const res=await fetch(`${api}/trending?region=${region}`,{signal:AbortSignal.timeout(8000)});
      if(!res.ok) continue;
      const data=await res.json();
      if(!Array.isArray(data)||!data.length) continue;
      return data.filter(i=>i.type==='stream'||i.type==='video'||!i.type).map(i=>({
        id: i.url?.split('v=')[1]||i.url?.split('/').pop()||'',
        title: i.title||'',
        author: i.uploaderName||'',
        duration: fmt(i.duration),
        type:'video'
      })).filter(i=>i.id);
    }catch{}
  }
  return [];
}

// Try API first, fallback to Piped
async function doSearch(q, filter){
  try{
    const results=await apiFetch('search',{q});
    if(Array.isArray(results)&&results.length) return results;
  }catch{}
  // Piped fallback
  const pFilter=filter==='song'||filter==='all'?'music_songs':filter==='album'?'music_albums':filter==='playlist'?'music_playlists':'music_songs';
  return pipedSearch(q, pFilter);
}

async function getSuggestions(q){
  try{
    const r=await apiFetch('search-suggestions',{q,music:'true'});
    if(Array.isArray(r)&&r.length) return r;
  }catch{}
  // Piped suggestions fallback
  for(const api of PIPED_APIS){
    try{
      const res=await fetch(`${api}/suggestions?query=${encodeURIComponent(q)}`,{signal:AbortSignal.timeout(5000)});
      if(!res.ok) continue;
      const d=await res.json();
      if(Array.isArray(d)&&d.length) return d;
    }catch{}
  }
  return [];
}

// ═══ AUDIO STREAM ═══
async function getStreamURL(id){
  const instances=[...INV];
  // shuffle to distribute load
  for(let i=instances.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[instances[i],instances[j]]=[instances[j],instances[i]];}
  // put last known good first
  if(S.invIdx>0){const good=instances.splice(S.invIdx%instances.length,1);instances.unshift(good[0]);}

  for(let i=0;i<<instances.length;i++){
    try{
      const res=await fetch(`${instances[i]}/api/v1/videos/${id}`,{signal:AbortSignal.timeout(9000)});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const d=await res.json();
      if(!d?.adaptiveFormats?.length) throw new Error('No formats');
      const streams=d.adaptiveFormats.filter(f=>f.type?.startsWith('audio')).sort((a,b)=>parseInt(b.bitrate)-parseInt(a.bitrate));
      if(!streams.length) throw new Error('No audio');
      S.invIdx=i;
      // Pick good quality (not highest to avoid rate limits)
      const stream=streams[Math.min(1,streams.length-1)];
      return {url:stream.url, meta:d};
    }catch(e){console.warn(instances[i],'failed:',e.message);}
  }

  // Last resort: Piped stream
  for(const api of PIPED_APIS){
    try{
      const res=await fetch(`${api}/streams/${id}`,{signal:AbortSignal.timeout(9000)});
      if(!res.ok) continue;
      const d=await res.json();
      const stream=d.audioStreams?.sort((a,b)=>b.bitrate-a.bitrate)?.[0];
      if(stream?.url) return {url:stream.url, meta:{title:d.title,author:d.uploader,lengthSeconds:d.duration,adaptiveFormats:[]}};
    }catch{}
  }
  throw new Error('No working audio source found. Check your connection.');
}

// ═══ PLAY ═══
async function playTrack(id, info={}){
  if(!id) return;
  if(S.id&&S.track) S.history.unshift({id:S.id,...S.track});
  if(S.history.length>60) S.history.pop();

  S.id=id; S.playing=false;
  const title=info.title||'Loading…';
  const author=info.author||'';
  updateMini({title,author,id});
  updatePlayerUI({title,author});
  setArt(id);
  if(!S.playerOpen) openPlayer();
  toast('⏳ Loading…');
  D.art.className='loading';

  try{
    const {url,meta}=await getStreamURL(id);
    const t=meta.title||title;
    const a=(meta.author||author||'').replace(' - Topic','');
    const dur=meta.lengthSeconds||0;
    S.track={title:t,author:a,duration:dur,id};
    updateMini({title:t,author:a,id});
    updatePlayerUI({title:t,author:a,duration:dur});
    setArt(id);
    updateMediaSession(t,a,id,dur);
    document.title=`${t} — Applify`;
    saveHistory(id,t,a);
    audio.src=url; audio.playbackRate=S.speed; audio.load();
    await audio.play().catch(()=>{});
  }catch(e){
    toast('⚠ '+e.message,4000);
    D.art.className='';
    updatePlayIcons();
  }
}

window.togglePlay=function(){if(!S.id)return;S.playing?audio.pause():audio.play().catch(()=>{})};

};
window.toggleLoop=function(){S.loop=!S.loop;audio.loop=S.loop;$('loop-btn').classList.toggle('on',S.loop);toast(S.loop?'🔁 Loop on':'Loop off')};
window.toggleShuffle=function(){S.shuffle=!S.shuffle;$('shuf-btn').classList.toggle('on',S.shuffle);if(S.shuffle&&S.queue.length>1)S.queue=shuffle([...S.queue]);renderQueue();toast(S.shuffle?'🔀 Shuffle on':'Shuffle off')};
window.toggleLike=function(){
  if(!S.id)return;
  if(S.liked.has(S.id)){S.liked.delete(S.id);toast('Removed from likes');}
  else{S.liked.add(S.id);toast('❤ Added to likes');}
  localStorage.setItem('ap_liked',JSON.stringify([...S.liked]));
  const lk=S.liked.has(S.id);D.likebtn.classList.toggle('on',lk);D.likeico.setAttribute('fill',lk?'currentColor':'none');
};
const speeds=[.5,.75,1,1.25,1.5,1.75,2];
let speedIdx=2;
window.cycleSpeed=function(){speedIdx=(speedIdx+1)%speeds.length;S.speed=speeds[speedIdx];audio.playbackRate=S.speed;D.spdBtn.textContent=S.speed+'×';toast(S.speed+'× speed')};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// ═══ PLAYER OPEN/CLOSE ═══
window.openPlayer=function(){if(!S.id)return;S.playerOpen=true;D.player.style.display='flex';requestAnimationFrame(()=>D.player.classList.add('open'))};
window.closePlayer=function(){S.playerOpen=false;D.player.classList.remove('open');setTimeout(()=>{if(!S.playerOpen)D.player.style.display='none'},460)};

// Swipe to close
let ty0=0,tt0=0;
D.player.addEventListener('touchstart',e=>{ty0=e.touches[0].clientY;tt0=Date.now()},{passive:true});
D.player.addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-ty0>90&&Date.now()-tt0<<350)closePlayer()},{passive:true});

// ═══ TABS ═══
window.switchTab=function(tab){
  $$('.view').forEach(v=>v.classList.remove('active'));
  $$('.nb').forEach(b=>b.classList.remove('on'));
  $(`${tab}-view`).classList.add('active');
  $(`nb-${tab}`)?.classList.add('on');
  if(tab==='queue') renderQueue();
  if(tab==='home'){updateGreeting();renderRecent();}
};

// ═══ QUEUE ═══
function renderQueue(){
  const el=$('queue-list');
  if(!S.queue.length&&!S.id){el.innerHTML='<div class="empty"><div class="ei">🎶</div><div class="et">Queue is empty</div><div class="es">Search and play music to fill it</div></div>';return;}
  let h='';
  if(S.id&&S.track){
    h+=`<div style="padding:8px 12px 4px;font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.8px">Now Playing</div>`;
    h+=`<div class="qi"><div class="qnum np">▶</div><img class="tthumb" src="${thumb(S.id)}" style="width:44px;height:44px" alt=""><div class="tinfo"><div class="ttl" style="color:var(--accent)">${esc(S.track.title)}</div><div class="tmeta">${esc(S.track.author)}</div></div></div>`;
  }
  if(S.queue.length){
    h+=`<div style="padding:12px 12px 4px;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.8px">Up Next</div>`;
    S.queue.forEach((t,i)=>{h+=`<div class="qi" onclick="playFromQ(${i})"><div class="qnum">${i+1}</div><img class="tthumb" src="${thumb(t.id)}" style="width:44px;height:44px" alt=""><div class="tinfo"><div class="ttl">${esc(t.title)}</div><div class="tmeta">${esc(t.author)}</div></div></div>`;});
  }
  el.innerHTML=h;
}
window.playFromQ=function(i){const t=S.queue.splice(i,1)[0];if(t)playTrack(t.id,t);renderQueue()};

// ═══ AUDIO EVENTS ═══
audio.addEventListener('playing',()=>{S.playing=true;updatePlayIcons();D.art.className='playing';D.toast.classList.remove('show')});
audio.addEventListener('pause',()=>{S.playing=false;updatePlayIcons();D.art.className=S.id?'paused':''});
audio.addEventListener('ended',()=>{if(!S.loop)skipNext()});
audio.addEventListener('timeupdate',()=>{
  if(document.activeElement===D.pbar)return;
  const ct=audio.currentTime,dur=audio.duration||S.duration||0;
  D.pbar.value=ct;D.tcur.textContent=fmt(ct);
  D.miniFill.style.width=(dur?(ct/dur)*100:0)+'%';
});
audio.addEventListener('loadedmetadata',()=>{if(audio.duration&&isFinite(audio.duration)){S.duration=audio.duration;D.pbar.max=audio.duration;D.ttot.textContent=fmt(audio.duration)}});
audio.addEventListener('loadstart',()=>{D.art.className='loading'});
audio.addEventListener('canplay',()=>{D.art.className=S.playing?'playing':'paused'});
audio.addEventListener('waiting',()=>toast('⏳ Buffering…',8000));
audio.addEventListener('error',()=>{
  if(!S.id)return;
  S.invIdx=(S.invIdx+1)%INV.length;
  toast('⚠ Stream error, retrying…');
  setTimeout(()=>playTrack(S.id,S.track),1000);
});

D.pbar.addEventListener('input',()=>{audio.currentTime=parseFloat(D.pbar.value);D.tcur.textContent=fmt(D.pbar.value)});
D.vslider.value=S.volume;
D.vslider.addEventListener('input',()=>{const v=parseFloat(D.vslider.value);audio.volume=v;S.volume=v;localStorage.setItem('ap_vol',v)});

// ═══ MEDIA SESSION ═══
function updateMediaSession(title,author,id,duration){
  if(!('mediaSession'in navigator))return;
  const ms=navigator.mediaSession;
  ms.metadata=new MediaMetadata({title,artist:author,artwork:[
    {src:thumb(id,'mqdefault'),sizes:'320x180',type:'image/jpeg'},
    {src:thumb(id,'hqdefault'),sizes:'480x360',type:'image/jpeg'},
    {src:thumb(id,'maxresdefault'),sizes:'1280x720',type:'image/jpeg'},
  ]});
  ms.setActionHandler('play',()=>audio.play());
  ms.setActionHandler('pause',()=>audio.pause());
  ms.setActionHandler('nexttrack',skipNext);
  ms.setActionHandler('previoustrack',skipPrev);
  ms.setActionHandler('seekbackward',d=>seek(-(d.seekOffset||15)));
  ms.setActionHandler('seekforward',d=>seek(d.seekOffset||15));
  try{ms.setActionHandler('seekto',d=>{if(d.seekTime!=null)audio.currentTime=d.seekTime})}catch{}
}
audio.addEventListener('timeupdate',()=>{
  const ms=navigator.mediaSession;
  if(!ms||!audio.duration||!isFinite(audio.duration))return;
  try{ms.setPositionState({duration:audio.duration,playbackRate:audio.playbackRate,position:audio.currentTime})}catch{}
},{passive:true});

// ═══ SEARCH ═══
let searchAC, suggestT;
D.sinput.addEventListener('input',()=>{
  const q=D.sinput.value.trim();
  D.sclr.classList.toggle('show',q.length>0);
  if(ytId(q)){hideSuggs();toast('YouTube URL detected — press Enter to play');return;}
  clearTimeout(suggestT);
  if(q.length>1) suggestT=setTimeout(()=>loadSuggs(q),320);
  else hideSuggs();
});
D.sinput.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;e.preventDefault();
  const q=D.sinput.value.trim();
  const id=ytId(q);
  if(id){playTrack(id,{title:'YouTube Video',author:''});D.sinput.blur();}
  else if(q){runSearch(q,S.searchFilter);hideSuggs();D.sinput.blur();}
});
D.sclr.addEventListener('click',()=>{D.sinput.value='';D.sclr.classList.remove('show');hideSuggs();showEmptyState();D.sinput.focus()});
$$('.chip').forEach(c=>c.addEventListener('click',()=>{
  $$('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');
  S.searchFilter=c.dataset.f;
  const q=D.sinput.value.trim();
  if(q&&!ytId(q)) runSearch(q,S.searchFilter);
}));

async function loadSuggs(q){
  const items=await getSuggestions(q);
  if(!items.length){hideSuggs();return;}
  D.suggs.innerHTML=items.slice(0,5).map(s=>`<div class="sg" onclick="pickSugg('${esc(s)}')"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><span>${esc(s)}</span></div>`).join('');
  D.suggs.classList.add('show');
}
function hideSuggs(){D.suggs.classList.remove('show');D.suggs.innerHTML='';}
window.pickSugg=function(t){D.sinput.value=t;D.sclr.classList.add('show');hideSuggs();runSearch(t,S.searchFilter);D.sinput.blur()};

async function runSearch(q,filter){
  if(searchAC) searchAC.abort();
  searchAC=new AbortController();
  D.results.innerHTML='<div class="spin-wrap"><div class="spin"></div><div class="spin-txt">Searching…</div></div>';
  try{
    const items=await doSearch(q,filter);
    if(!items||!items.length){D.results.innerHTML='<div class="empty"><div class="ei">🔍</div><div class="et">No results</div><div class="es">Try a different search term</div></div>';return;}
    S.searchResults=items;
    renderResults(items);
  }catch(e){
    if(e.name==='AbortError')return;
    D.results.innerHTML=`<div class="empty"><div class="ei">⚠️</div><div class="et">Search failed</div><div class="es">${esc(e.message)}</div></div>`;
  }
}

function renderResults(items){
  D.results.innerHTML=items.map((item,idx)=>{
    const id=item.id||item.videoId;if(!id)return'';
    const t=item.title||'Unknown',a=(item.author||item.artist||'').replace(' - Topic','');
    return `<div class="ti fu ${id===S.id?'now':''}" style="animation-delay:${idx*.04}s" onclick="playItem(${idx})">
      <img class="tthumb" src="${thumb(id)}" alt="" loading="lazy" onerror="this.style.opacity='.2'">
      <div class="tinfo"><div class="ttl">${esc(t)}</div><div class="tmeta">${esc(a)}</div></div>
      ${item.duration?`<div class="tdur">${esc(item.duration)}</div>`:''}
    </div>`;
  }).join('');
}

window.playItem=function(idx){
  const item=S.searchResults[idx];if(!item)return;
  const id=item.id||item.videoId;if(!id)return;
  const t=item.title||'Unknown',a=(item.author||item.artist||'').replace(' - Topic','');
  const rest=S.searchResults.slice(idx+1).filter(i=>i.id||i.videoId).map(i=>({id:i.id||i.videoId,title:i.title||'Unknown',author:(i.author||i.artist||'').replace(' - Topic','')}));
  S.queue=S.shuffle?shuffle(rest):rest;
  playTrack(id,{title:t,author:a});
};

function showEmptyState(){D.results.innerHTML='<div class="empty"><div class="ei">🎵</div><div class="et">Applify</div><div class="es">Search for music or paste a YouTube URL</div></div>';}

// ═══ HOME ═══
function updateGreeting(){
  const h=new Date().getHours();
  const s=h<<5?'🌙 Late night':h<<12?'Good morning':h<<17?'Good afternoon':h<<21?'Good evening':'🌙 Good night';
  $('greet-sub').textContent=s;
}

function saveHistory(id,title,author){
  let h=JSON.parse(localStorage.getItem('ap_history')||'[]');
  h=h.filter(i=>i.id!==id);h.unshift({id,title,author,ts:Date.now()});
  localStorage.setItem('ap_history',JSON.stringify(h.slice(0,30)));
}

function renderRecent(){
  const h=JSON.parse(localStorage.getItem('ap_history')||'[]');
  const sec=$('recent-sec'),list=$('recent-list');
  if(!h.length){sec.style.display='none';return;}
  sec.style.display='block';
  list.innerHTML=h.slice(0,8).map(i=>`<div class="ri" onclick="playTrack('${esc(i.id)}',${JSON.stringify({title:i.title,author:i.author}).replace(/</g,'\\u003c')})">
    <img class="rimg" src="${thumb(i.id)}" alt="" loading="lazy">
    <div class="rinfo"><div class="rttl">${esc(i.title)}</div><div class="rmet">${esc(i.author)}</div></div>
    <button class="rpb" aria-label="Play"><svg width="13" height="13" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
  </div>`).join('');
}

async function loadHomeContent(){
  updateGreeting();renderRecent();

  // Render moods instantly
  $('mood-row').innerHTML=MOODS.map(m=>`<div class="mood" onclick="searchMood('${esc(m.q)}','${esc(m.label)}')">
    <div class="mood-img" style="background:${m.c}">${m.e}</div>
    <div class="mood-lbl">${m.label}</div>
  </div>`).join('');

  // Load trending for selected region
  const region=S.region;
  $('feat-row').innerHTML='<div class="skel sk-fc"></div><div class="skel sk-fc"></div><div class="skel sk-fc"></div>';
  $('hot-row').innerHTML='<div class="skel sk-gc"></div><div class="skel sk-gc"></div><div class="skel sk-gc"></div><div class="skel sk-gc"></div>';

  // Trending — API first, Piped fallback
  (async()=>{
    let items=[];
    try{ items=await apiFetch('trending',{region}); }catch{}
    if(!items||!items.length) items=await pipedTrending(region);
    if(!items||!items.length){
      const r=await doSearch(`trending music ${REGIONS.find(r=>r.code===region)?.name||region} 2025`,'relevance');
      if(r.length) renderFeatured(r.slice(0,6));
      return;
    }
    renderFeatured(items.slice(0,8));
    renderHot(items.slice(8,16));
  })();
}

function renderFeatured(items){
  const badges=['🔥 Trending','⭐ Popular','✨ Fresh','🎵 Hot','📈 Viral','🎤 Featured'];
  $('feat-row').innerHTML=items.slice(0,5).map((item,i)=>
    `<div class="fc" onclick="playHomeItem(${JSON.stringify(item).replace(/"/g,'&quot;')})">
      <img src="${thumb(item.id,'hqdefault')}" alt="" loading="lazy" onerror="this.style.opacity='.3'">
      <div class="fcbdg">${badges[i%badges.length]}</div>
      <div class="fco"><div class="fcttl">${esc(item.title)}</div><div class="fcath">${esc(item.author.replace(' - Topic',''))}</div></div>
    </div>`
  ).join('');
}

function renderHot(items){
  if(!items.length)return;
  $('hot-row').innerHTML=items.slice(0,8).map(item=>
    `<div class="gc" onclick="playHomeItem(${JSON.stringify(item).replace(/"/g,'&quot;')})">
      <img class="gcimg" src="${thumb(item.id)}" alt="" loading="lazy" onerror="this.style.opacity='.3'">
      <div class="gcttl">${esc(item.title)}</div>
      <div class="gcmeta">${esc(item.author.replace(' - Topic',''))}</div>
    </div>`
  ).join('');
}

window.playHomeItem=function(item){
  if(!item||!item.id)return;
  playTrack(item.id,{title:item.title,author:item.author});
};

window.searchMood=function(q,label){
  switchTab('search');
  D.sinput.value=label;D.sclr.classList.add('show');
  runSearch(q,'all');
};

// ═══ SCROLL FIX ═══
document.addEventListener('touchmove',e=>{
  const ok=e.target.closest('.scr')||e.target.closest('#pbar')||e.target.closest('#vslider')||e.target.closest('.fscr')||e.target.closest('.gscr');
  if(!ok) e.preventDefault();
},{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());

// ═══ KEYBOARD ═══
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  if(e.code==='ArrowLeft') seek(-15);
  if(e.code==='ArrowRight') seek(15);
  if(e.code==='Escape') closePlayer();
});

// ═══ SERVICE WORKER ═══
if('serviceWorker'in navigator){
  navigator.serviceWorker.register('/sw.js').then(r=>console.log('SW:',r.scope)).catch(()=>{});
  setInterval(()=>{navigator.serviceWorker.ready.then(r=>{const ch=new MessageChannel();r.active?.postMessage('ping',[ch.port2])}).catch(()=>{})},20000);
}

// ═══ iOS HINT ═══
window.addEventListener('load',()=>{
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(isIOS&&!navigator.standalone){
    setTimeout(()=>{
      toast('📲 Tap Share → Add to Home Screen for background play',5000);
    },3000);
  }
});

// ═══ URL PARAMS ═══
(()=>{const p=new URLSearchParams(location.search);const id=p.get('v')||ytId(p.get('url')||'');if(id)setTimeout(()=>playTrack(id,{title:'Loading…',author:''}),600)})();

// ═══ INIT ═══
loadHomeContent();
console.log('🎵 Applify ready');
</script>
